name: Build Windows Setup EXE

on:
  push:
    branches: [main]
    paths:
      - 'setup/**'
  pull_request:
    paths:
      - 'setup/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: setup

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --clean VPS-WireGuard-Setup.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPS-WireGuard-Setup
          path: setup/dist/VPS-WireGuard-Setup.exe
