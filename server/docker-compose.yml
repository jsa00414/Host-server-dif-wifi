# WireGuard Easy v15.3.0 + Caddy + VPN-only Domain Manager
# Deployed by VPS WireGuard Setup

volumes:
  etc_wireguard:
  caddy_config:
  caddy_data:
  domain_data:

networks:
  vpn_stack:
    name: vpn_stack
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.3.0
    container_name: wg-easy
    restart: unless-stopped
    environment:
      - PORT=${WG_UI_PORT:-51821}
      - INSECURE=${WG_INSECURE:-true}
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_TUNNEL_PORT:-51820}:${WG_TUNNEL_PORT:-51820}/udp"
      - "${WG_UI_PORT:-51821}:${WG_UI_PORT:-51821}/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    networks:
      - vpn_stack

  caddy:
    image: caddy:2.10.0-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - wg-easy
      - domain-manager
    environment:
      - WG_UI_PORT=${WG_UI_PORT:-51821}
      - WG_DOMAIN=${WG_DOMAIN:-localhost}
      - DOMAIN_MANAGER_HOST=${DOMAIN_MANAGER_HOST:-domains.localhost}
      - VPN_SUBNET=${VPN_SUBNET:-10.8.0.0/24}
      - CADDY_EMAIL=${CADDY_EMAIL:-admin@localhost}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
      - caddy_data:/data
      - ./domains:/etc/caddy/domains:ro
    networks:
      - vpn_stack

  domain-manager:
    build: ./domain-manager
    container_name: domain-manager
    restart: unless-stopped
    environment:
      - CADDY_CONTAINER=caddy
      - DOMAINS_DIR=/domains
      - ADMIN_TOKEN=${DOMAIN_ADMIN_TOKEN}
      - VPN_SUBNET=${VPN_SUBNET:-10.8.0.0/24}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./domains:/domains
      - domain_data:/data
    networks:
      - vpn_stack
