<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Email code test · ServerManager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #07110d;
      --bg1: #0e1a15;
      --line: rgba(170, 210, 185, 0.14);
      --text: #e7f1eb;
      --muted: #7f9689;
      --accent: #3ddea0;
      --danger: #ff6b6b;
      --ok: #3ddea0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Sora", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: max(10vh, env(safe-area-inset-top)) 18px 28px;
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(61, 222, 160, 0.16), transparent 55%),
        radial-gradient(700px 420px at 90% 85%, rgba(40, 120, 90, 0.22), transparent 50%),
        linear-gradient(160deg, #050a08 0%, var(--bg0) 45%, #0a1511 100%);
    }
    .shell { width: min(440px, 100%); }
    .card {
      border-radius: 21px;
      background: color-mix(in srgb, var(--bg1) 92%, black);
      border: 1px solid var(--line);
      padding: 32px 26px 26px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: -.03em;
      text-align: center;
    }
    .sub {
      margin: 10px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.45;
    }
    .sub code {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: .8rem;
      color: var(--accent);
    }
    form { margin-top: 22px; display: grid; gap: 12px; }
    label {
      display: grid; gap: 7px;
      font-size: .78rem; color: var(--muted);
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      font: 500 1.15rem/1.2 "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: .28em;
      text-align: center;
    }
    input:focus {
      outline: none;
      border-color: rgba(61,222,160,.55);
      box-shadow: 0 0 0 3px rgba(61,222,160,.12);
    }
    .row { display: grid; gap: 10px; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: 600 .95rem/1 Sora, system-ui, sans-serif;
      cursor: pointer;
    }
    .primary {
      background: var(--accent);
      color: #04110c;
    }
    .ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    button:disabled { opacity: .55; cursor: wait; }
    .msg {
      min-height: 1.3em;
      margin-top: 14px;
      text-align: center;
      font-size: .86rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--danger); }
    .steps {
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: .8rem;
    }
    .steps li {
      display: grid;
      grid-template-columns: 1.4rem 1fr;
      gap: 8px;
      align-items: start;
    }
    .steps b { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1>Email code test</h1>
      <p class="sub">Sends a 6-digit code to<br><code>portalvpsserver@truemailor.com</code><br>(forwards to your Gmail)</p>

      <div class="row" style="margin-top:22px">
        <button type="button" class="primary" id="sendBtn">Send test code</button>
      </div>

      <form id="verifyForm">
        <label>
          Enter code
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••" required />
        </label>
        <button type="submit" class="ghost" id="verifyBtn">Verify code</button>
      </form>

      <div class="msg" id="msg" aria-live="polite"></div>

      <ol class="steps">
        <li><span>1</span><span><b>Send</b> code → check Gmail for “Portal login code”</span></li>
        <li><span>2</span><span><b>Enter</b> the 6 digits here</span></li>
        <li><span>3</span><span>Codes expire in <b>10 minutes</b></span></li>
      </ol>
    </div>
  </div>
  <script>
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const verifyBtn = document.getElementById("verifyBtn");
    const codeInput = document.getElementById("code");

    function setMsg(text, kind) {
      msg.textContent = text || "";
      msg.className = "msg" + (kind ? " " + kind : "");
    }

    async function api(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      let data = {};
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) {
        throw new Error(data.error || ("HTTP " + res.status));
      }
      return data;
    }

    sendBtn.addEventListener("click", async () => {
      sendBtn.disabled = true;
      setMsg("Sending…");
      try {
        const data = await api("/api/email-code/send", {});
        setMsg(data.message || "Code sent. Check Gmail.", "ok");
        codeInput.focus();
      } catch (e) {
        setMsg(String(e.message || e), "err");
      } finally {
        sendBtn.disabled = false;
      }
    });

    document.getElementById("verifyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      verifyBtn.disabled = true;
      setMsg("Checking…");
      try {
        const data = await api("/api/email-code/verify", { code: codeInput.value.trim() });
        setMsg(data.message || "Code accepted.", "ok");
      } catch (err) {
        setMsg(String(err.message || err), "err");
      } finally {
        verifyBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
