<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LAN bridge</title>
  <script src="/static/sm-circle-crypto.js"></script>
</head>
<body>
<script>
  (function () {
    const LAN_RE = /^192\.168\.8\.(?:[2-9]|\d{2}|1\d{2}|2[0-4]\d|25[0-4])$/;
    function exportLanKeys() {
      const out = {};
      try {
        const store = (window.SmCircleCrypto && SmCircleCrypto.loadStore()) || {};
        Object.keys(store).forEach((ip) => {
          if (!LAN_RE.test(ip)) return;
          const row = store[ip];
          if (row && row.privateJwk && row.publicKey) out[ip] = row;
        });
      } catch (_) {}
      return out;
    }
    function send() {
      const keys = exportLanKeys();
      try {
        parent.postMessage(
          {
            type: "sm-network-lan-ips",
            ips: Object.keys(keys),
            keys,
            source: location.origin,
          },
          "*"
        );
      } catch (_) {}
    }
    send();
    setTimeout(send, 250);
  })();
</script>
</body>
</html>
