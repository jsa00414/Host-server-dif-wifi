<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LAN bridge</title>
  <script src="/static/sm-circle-crypto.js"></script>
</head>
<body>
<script>
  (function () {
    const LAN_RE = /^192\.168\.8\.(?:[2-9]|\d{2}|1\d{2}|2[0-4]\d|25[0-4])$/;
    function ips() {
      try {
        const store = (window.SmCircleCrypto && SmCircleCrypto.loadStore()) || {};
        return Object.keys(store).filter((ip) => LAN_RE.test(ip));
      } catch (_) {
        return [];
      }
    }
    function send() {
      const list = ips();
      try {
        parent.postMessage(
          { type: "sm-network-lan-ips", ips: list, source: location.origin },
          "*"
        );
      } catch (_) {}
    }
    send();
    setTimeout(send, 250);
  })();
</script>
</body>
</html>
