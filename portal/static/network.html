<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network exit · vpstruelord</title>
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a222c;
      --ink: #e8eef4;
      --muted: #8b9aab;
      --line: rgba(232, 238, 244, 0.12);
      --accent: #3d9b7a;
      --accent2: #4a7fb5;
      --warn: #c4a35a;
      --danger: #c45c5c;
      --card: rgba(255, 255, 255, 0.04);
      --font: "IBM Plex Sans", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 10% -10%, rgba(61, 155, 122, 0.18), transparent 60%),
        radial-gradient(700px 420px at 100% 0%, rgba(74, 127, 181, 0.16), transparent 55%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #12181f);
    }
    main {
      width: min(560px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      margin: 0 0 1.5rem;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.15rem 1.2rem;
      margin-bottom: 1rem;
    }
    .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .ip {
      font-family: var(--mono);
      font-size: 1.25rem;
      font-weight: 600;
      word-break: break-all;
    }
    .meta {
      margin-top: 0.55rem;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    #devicePick {
      margin-top: 0.85rem;
      width: 100%;
      font: inherit;
      font-family: var(--mono);
      font-size: 0.95rem;
      color: var(--ink);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
    }
    #devicePick[hidden] { display: none; }
    .choices {
      display: grid;
      gap: 0.65rem;
    }
    button.choice {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.22);
      color: var(--ink);
      border-radius: 12px;
      padding: 0.95rem 1rem;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.12s;
    }
    button.choice:hover { border-color: rgba(232, 238, 244, 0.28); }
    button.choice:active { transform: scale(0.99); }
    button.choice.active {
      border-color: var(--accent);
      background: rgba(61, 155, 122, 0.14);
      box-shadow: inset 0 0 0 1px rgba(61, 155, 122, 0.35);
    }
    button.choice.active.ts {
      border-color: var(--accent2);
      background: rgba(74, 127, 181, 0.16);
      box-shadow: inset 0 0 0 1px rgba(74, 127, 181, 0.4);
    }
    button.choice .title {
      display: block;
      font-weight: 650;
      margin-bottom: 0.2rem;
    }
    button.choice .hint {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      background: #10161c;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 0.7rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      max-width: calc(100% - 2rem);
      z-index: 20;
    }
    .toast.show { opacity: 1; }
    .toast.err { border-color: rgba(196, 92, 92, 0.5); }
    .busy { opacity: 0.55; pointer-events: none; }
    select {
      margin-top: 0.65rem;
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.28);
      color: var(--ink);
      padding: 0.55rem 0.7rem;
      font: inherit;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;550;650&display=swap" rel="stylesheet" />
</head>
<body>
  <main>
    <h1>Network exit</h1>
    <p class="sub">This device’s IPv4 can send internet through Tailscale (exit node) or Surfshark — only this address is changed.</p>

    <section class="panel">
      <div class="label">Controlling</div>
      <div class="ip" id="controlIp">…</div>
      <div class="meta" id="meta"></div>
      <select id="devicePick" aria-label="This device IP" hidden></select>
    </section>

    <section class="panel choices" id="choices">
      <button type="button" class="choice" data-provider="tailscale" id="btnTs">
        <span class="title">Tailscale exit node</span>
        <span class="hint">Route this IP via the active Tailscale exit node.</span>
      </button>
      <div>
        <button type="button" class="choice" data-provider="surfshark" id="btnSs">
          <span class="title">Surfshark</span>
          <span class="hint">Route this IP through the Surfshark WireGuard tunnel.</span>
        </button>
        <select id="ssServer" aria-label="Surfshark server" hidden></select>
      </div>
      <button type="button" class="choice" data-provider="direct" id="btnDirect">
        <span class="title">Direct / default</span>
        <span class="hint">Clear the per-device override (follow the normal exit).</span>
      </button>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="/static/sm-circle-crypto.js"></script>
  <script>
    const LAST_IP_KEY = "sm.network.deviceIp.v1";
    const LAN_RE = /^192\.168\.8\.(?:[2-9]|\d{2}|1\d{2}|2[0-4]\d|25[0-4])$/;
    const els = {
      controlIp: document.getElementById("controlIp"),
      meta: document.getElementById("meta"),
      devicePick: document.getElementById("devicePick"),
      choices: document.getElementById("choices"),
      toast: document.getElementById("toast"),
      ssServer: document.getElementById("ssServer"),
      btnTs: document.getElementById("btnTs"),
      btnSs: document.getElementById("btnSs"),
      btnDirect: document.getElementById("btnDirect"),
    };
    let state = null;
    let lanIp = "";
    let toastTimer = 0;

    function toast(msg, err) {
      els.toast.textContent = msg;
      els.toast.classList.toggle("err", !!err);
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 3600);
    }

    function isHomeLanIp(ip) {
      return LAN_RE.test(String(ip || "").trim());
    }

    function rememberIp(ip) {
      if (!isHomeLanIp(ip)) return;
      try { localStorage.setItem(LAST_IP_KEY, ip); } catch (_) {}
    }

    function rememberedIp() {
      try {
        const ip = localStorage.getItem(LAST_IP_KEY) || "";
        return isHomeLanIp(ip) ? ip : "";
      } catch (_) {
        return "";
      }
    }

    function circleStoreLanIps() {
      try {
        const store = (window.SmCircleCrypto && SmCircleCrypto.loadStore()) || {};
        return Object.keys(store)
          .filter(isHomeLanIp)
          .sort((a, b) => {
            const ca = Number(store[a]?.createdAt || 0);
            const cb = Number(store[b]?.createdAt || 0);
            return cb - ca;
          });
      } catch (_) {
        return [];
      }
    }

    function extractLanFromText(text) {
      const found = [];
      const re = /\b(192\.168\.8\.(?:[2-9]|\d{2}|1\d{2}|2[0-4]\d|25[0-4]))\b/g;
      let m;
      while ((m = re.exec(String(text || "")))) {
        if (!found.includes(m[1])) found.push(m[1]);
      }
      return found;
    }

    async function detectHomeLanIpViaWebRtc() {
      return await new Promise((resolve) => {
        let done = false;
        const finish = (ip) => {
          if (done) return;
          done = true;
          try { pc.close(); } catch (_) {}
          resolve(ip || "");
        };
        let pc;
        try {
          pc = new RTCPeerConnection({ iceServers: [] });
        } catch (_) {
          resolve("");
          return;
        }
        try { pc.createDataChannel("sm"); } catch (_) {}
        const consider = (text) => {
          const ips = extractLanFromText(text);
          if (ips.length) finish(ips[0]);
        };
        pc.onicecandidate = (ev) => {
          if (!ev?.candidate) return;
          consider(ev.candidate.candidate || "");
          try { consider(JSON.stringify(ev.candidate)); } catch (_) {}
        };
        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer))
          .then(() => consider(pc.localDescription?.sdp || ""))
          .catch(() => finish(""));
        setTimeout(() => {
          consider(pc.localDescription?.sdp || "");
          finish("");
        }, 2800);
      });
    }

    async function detectDeviceIp() {
      const webrtc = await detectHomeLanIpViaWebRtc();
      if (isHomeLanIp(webrtc)) return webrtc;
      const remembered = rememberedIp();
      if (remembered) return remembered;
      const circleIps = circleStoreLanIps();
      if (circleIps.length === 1) return circleIps[0];
      if (circleIps.length > 1) return circleIps[0];
      return "";
    }

    function fillDevicePicker(selected) {
      const ips = circleStoreLanIps();
      const opts = [...ips];
      if (selected && isHomeLanIp(selected) && !opts.includes(selected)) {
        opts.unshift(selected);
      }
      if (!opts.length) {
        els.devicePick.hidden = true;
        els.devicePick.innerHTML = "";
        return;
      }
      // Show picker when WebRTC missed or multiple circle keys exist.
      const show = !selected || opts.length > 1 || !!state?.needs_device_ip || !!state?.via_flint;
      els.devicePick.hidden = !show;
      els.devicePick.innerHTML = opts.map((ip) =>
        `<option value="${ip}" ${ip === selected ? "selected" : ""}>${ip}</option>`
      ).join("");
    }

    function render() {
      if (!state) return;
      const ip = state.control_ip || lanIp || "";
      els.controlIp.textContent = ip || "device IP needed";
      const bits = [];
      if (state.via_flint) bits.push("via Flint VPN");
      if (state.client_ip && state.client_ip !== ip) bits.push(`connection ${state.client_ip}`);
      if (state.lan_ip) bits.push(`LAN ${state.lan_ip}`);
      if (state.needs_device_ip) {
        bits.push("pick this device’s 192.168.8.x below");
      } else if (state.provider_label) {
        bits.push(`now: ${state.provider_label}`);
      }
      if (state.global_exit) bits.push(`network default: ${state.global_exit}`);
      els.meta.textContent = bits.join(" · ") || "Ready";
      fillDevicePicker(ip || lanIp);

      const prov = String(state.provider || "direct");
      els.btnTs.classList.toggle("active", prov === "tailscale");
      els.btnTs.classList.toggle("ts", prov === "tailscale");
      els.btnSs.classList.toggle("active", prov === "surfshark");
      els.btnDirect.classList.toggle("active", prov === "direct" || prov === "clear" || !prov);

      const servers = state.surfshark_servers || [];
      if (servers.length) {
        els.ssServer.hidden = false;
        const cur = state.surfshark_server || servers[0].id;
        els.ssServer.innerHTML = servers.map((s) =>
          `<option value="${s.id}" ${s.id === cur ? "selected" : ""}>${s.label || s.id}</option>`
        ).join("");
      } else {
        els.ssServer.hidden = true;
      }

      const canAct = !!(state.control_ip);
      els.choices.classList.toggle("busy", !canAct);
    }

    async function exitHeaders(extra) {
      const headers = { Accept: "application/json", ...(extra || {}) };
      if (lanIp) headers["X-SM-Lan-Ip"] = lanIp;
      try {
        if (lanIp && window.SmCircleCrypto && SmCircleCrypto.getKeyForIp) {
          const row = await SmCircleCrypto.getKeyForIp(lanIp);
          if (row?.publicKey) {
            const proof = await SmCircleCrypto.circleHeaders(lanIp, {
              method: headers["Content-Type"] ? "POST" : "GET",
              path: "/api/network/exit",
              bodyText: "",
            });
            Object.assign(headers, proof);
          }
        }
      } catch (_) {}
      return headers;
    }

    async function refresh() {
      const headers = await exitHeaders();
      const res = await fetch("/api/network/exit", { headers, cache: "no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
      state = data;
      if (data.control_ip && isHomeLanIp(data.control_ip)) {
        lanIp = data.control_ip;
        rememberIp(lanIp);
      }
      render();
      if (data.needs_device_ip && !lanIp) {
        toast(data.error || "Need this device’s LAN IP", true);
      }
    }

    async function setProvider(provider) {
      if (!lanIp && !state?.control_ip) {
        toast("Need this device’s 192.168.8.x IP first", true);
        return;
      }
      els.choices.classList.add("busy");
      try {
        const body = {
          provider,
          lan_ip: lanIp || state.control_ip || undefined,
        };
        if (provider === "surfshark" && els.ssServer.value) {
          body.server = els.ssServer.value;
        }
        if (provider === "tailscale" && state?.tailscale_exit_ip) {
          body.exit_ip = state.tailscale_exit_ip;
        }
        const bodyText = JSON.stringify(body);
        const headers = await exitHeaders({ "Content-Type": "application/json" });
        // Re-sign with body hash for POST
        try {
          if (lanIp && window.SmCircleCrypto && (await SmCircleCrypto.getKeyForIp(lanIp))) {
            Object.assign(
              headers,
              await SmCircleCrypto.circleHeaders(lanIp, {
                method: "POST",
                path: "/api/network/exit",
                bodyText,
              })
            );
          }
        } catch (_) {}
        const res = await fetch("/api/network/exit", {
          method: "POST",
          headers,
          body: bodyText,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
        state = data;
        if (data.control_ip && isHomeLanIp(data.control_ip)) {
          lanIp = data.control_ip;
          rememberIp(lanIp);
        }
        render();
        toast(data.message || `Set ${provider}`);
      } catch (err) {
        toast(String(err?.message || err), true);
      } finally {
        els.choices.classList.remove("busy");
        render();
      }
    }

    els.devicePick.onchange = async () => {
      const ip = els.devicePick.value;
      if (!isHomeLanIp(ip)) return;
      lanIp = ip;
      rememberIp(ip);
      try {
        if (window.SmCircleCrypto) await SmCircleCrypto.ensureKeyForIp(ip);
      } catch (_) {}
      try {
        await refresh();
      } catch (err) {
        toast(String(err?.message || err), true);
      }
    };

    els.btnTs.onclick = () => setProvider("tailscale");
    els.btnSs.onclick = () => setProvider("surfshark");
    els.btnDirect.onclick = () => setProvider("direct");

    (async () => {
      try {
        lanIp = await detectDeviceIp();
        if (lanIp) rememberIp(lanIp);
        await refresh();
      } catch (err) {
        els.controlIp.textContent = "unavailable";
        els.meta.textContent = String(err?.message || err);
        fillDevicePicker(lanIp);
        toast(String(err?.message || err), true);
      }
    })();
  </script>
</body>
</html>
