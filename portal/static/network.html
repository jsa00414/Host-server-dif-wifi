<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network exit · vpstruelord</title>
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a222c;
      --ink: #e8eef4;
      --muted: #8b9aab;
      --line: rgba(232, 238, 244, 0.12);
      --accent: #3d9b7a;
      --accent2: #4a7fb5;
      --warn: #c4a35a;
      --danger: #c45c5c;
      --card: rgba(255, 255, 255, 0.04);
      --font: "IBM Plex Sans", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 10% -10%, rgba(61, 155, 122, 0.18), transparent 60%),
        radial-gradient(700px 420px at 100% 0%, rgba(74, 127, 181, 0.16), transparent 55%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #12181f);
    }
    main {
      width: min(560px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .back {
      margin: 0 0 0.85rem;
      font-size: 0.88rem;
    }
    .back a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 550;
    }
    .back a:hover { text-decoration: underline; }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      margin: 0 0 1.5rem;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.15rem 1.2rem;
      margin-bottom: 1rem;
    }
    .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .ip {
      font-family: var(--mono);
      font-size: 1.25rem;
      font-weight: 600;
      word-break: break-all;
    }
    .meta {
      margin-top: 0.55rem;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .device-row {
      margin-top: 0.85rem;
      display: grid;
      gap: 0.55rem;
    }
    .device-row[hidden] { display: none; }
    #devicePick, #deviceManual {
      width: 100%;
      font: inherit;
      font-family: var(--mono);
      font-size: 0.95rem;
      color: var(--ink);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
    }
    #useDeviceBtn {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      cursor: pointer;
      background: var(--accent);
      color: #04140f;
    }
    #useDeviceBtn:disabled { opacity: 0.5; cursor: default; }
    .choices {
      display: grid;
      gap: 0.65rem;
    }
    button.choice {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.22);
      color: var(--ink);
      border-radius: 12px;
      padding: 0.95rem 1rem;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.12s;
    }
    button.choice:hover { border-color: rgba(232, 238, 244, 0.28); }
    button.choice:active { transform: scale(0.99); }
    button.choice.active {
      border-color: var(--accent);
      background: rgba(61, 155, 122, 0.14);
      box-shadow: inset 0 0 0 1px rgba(61, 155, 122, 0.35);
    }
    button.choice.active.ts {
      border-color: var(--accent2);
      background: rgba(74, 127, 181, 0.16);
      box-shadow: inset 0 0 0 1px rgba(74, 127, 181, 0.4);
    }
    button.choice .title {
      display: block;
      font-weight: 650;
      margin-bottom: 0.2rem;
    }
    button.choice .hint {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      background: #10161c;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 0.7rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      max-width: calc(100% - 2rem);
      z-index: 20;
    }
    .toast.show { opacity: 1; }
    .toast.err { border-color: rgba(196, 92, 92, 0.5); }
    .busy { opacity: 0.55; pointer-events: none; }
    select {
      margin-top: 0.65rem;
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.28);
      color: var(--ink);
      padding: 0.55rem 0.7rem;
      font: inherit;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;550;650&display=swap" rel="stylesheet" />
</head>
<body>
  <main>
    <p class="back"><a id="backAuth" href="/">← Authenticator</a></p>
    <h1>Network exit</h1>
    <p class="sub">Circle devices only. This device’s Wi‑Fi IPv4 can send internet through Tailscale (exit node) or Surfshark — only that address is changed.</p>

    <section class="panel">
      <div class="label">Controlling</div>
      <div class="ip" id="controlIp">…</div>
      <div class="meta" id="meta"></div>
      <div class="device-row" id="deviceRow" hidden>
        <select id="devicePick" aria-label="This device IP"></select>
        <input id="deviceManual" type="text" inputmode="decimal" autocomplete="off"
          placeholder="or type 192.168.8.x" aria-label="Type this device LAN IP" />
        <button type="button" id="useDeviceBtn">Use this device IP</button>
      </div>
    </section>

    <section class="panel choices" id="choices">
      <button type="button" class="choice" data-provider="tailscale" id="btnTs">
        <span class="title">Tailscale exit node</span>
        <span class="hint">Route this IP via the active Tailscale exit node.</span>
      </button>
      <div>
        <button type="button" class="choice" data-provider="surfshark" id="btnSs">
          <span class="title">Surfshark</span>
          <span class="hint">Route this IP through the Surfshark WireGuard tunnel.</span>
        </button>
        <select id="ssServer" aria-label="Surfshark server" hidden></select>
      </div>
      <button type="button" class="choice" data-provider="direct" id="btnDirect">
        <span class="title">Direct / default</span>
        <span class="hint">Clear the per-device override (follow the normal exit).</span>
      </button>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="/static/sm-circle-crypto.js"></script>
  <script>
    const LAST_IP_KEY = "sm.network.deviceIp.v1";
    const TOTP_STORE_KEY = "sm.auth.totp.v1";
    const TOTP_PERIOD = 30;
    const TOTP_DIGITS = 6;
    const LAN_RE = /^192\.168\.8\.(?:[2-9]|\d{2}|1\d{2}|2[0-4]\d|25[0-4])$/;
    const els = {
      controlIp: document.getElementById("controlIp"),
      meta: document.getElementById("meta"),
      deviceRow: document.getElementById("deviceRow"),
      devicePick: document.getElementById("devicePick"),
      deviceManual: document.getElementById("deviceManual"),
      useDeviceBtn: document.getElementById("useDeviceBtn"),
      choices: document.getElementById("choices"),
      toast: document.getElementById("toast"),
      ssServer: document.getElementById("ssServer"),
      btnTs: document.getElementById("btnTs"),
      btnSs: document.getElementById("btnSs"),
      btnDirect: document.getElementById("btnDirect"),
    };
    let state = null;
    let lanIp = "";
    let bridgeIps = [];
    let toastTimer = 0;

    function toast(msg, err) {
      els.toast.textContent = msg;
      els.toast.classList.toggle("err", !!err);
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 3600);
    }

    function isHomeLanIp(ip) {
      return LAN_RE.test(String(ip || "").trim());
    }

    function rememberIp(ip) {
      if (!isHomeLanIp(ip)) return;
      try { localStorage.setItem(LAST_IP_KEY, ip); } catch (_) {}
    }

    function rememberedIp() {
      try {
        const ip = localStorage.getItem(LAST_IP_KEY) || "";
        return isHomeLanIp(ip) ? ip : "";
      } catch (_) {
        return "";
      }
    }

    function loadTotpAccount() {
      try {
        const raw = localStorage.getItem(TOTP_STORE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        const secret = String(data?.secret || "").replace(/\s+/g, "").toUpperCase();
        return secret ? { secret } : null;
      } catch (_) {
        return null;
      }
    }

    function b32Decode(secret) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      let bits = "";
      const cleaned = String(secret || "").replace(/=+$/, "").toUpperCase();
      for (const ch of cleaned) {
        const val = alphabet.indexOf(ch);
        if (val < 0) continue;
        bits += val.toString(2).padStart(5, "0");
      }
      const bytes = [];
      for (let i = 0; i + 8 <= bits.length; i += 8) {
        bytes.push(parseInt(bits.slice(i, i + 8), 2));
      }
      return new Uint8Array(bytes);
    }

    async function hmacSha1(keyBytes, msgBytes) {
      const key = await crypto.subtle.importKey(
        "raw",
        keyBytes,
        { name: "HMAC", hash: "SHA-1" },
        false,
        ["sign"]
      );
      return new Uint8Array(await crypto.subtle.sign("HMAC", key, msgBytes));
    }

    async function totpAt(secret, forTime = Date.now() / 1000) {
      const counter = Math.floor(forTime / TOTP_PERIOD);
      const msg = new Uint8Array(8);
      let n = counter;
      for (let i = 7; i >= 0; i--) {
        msg[i] = n & 0xff;
        n = Math.floor(n / 256);
      }
      const digest = await hmacSha1(b32Decode(secret), msg);
      const offset = digest[digest.length - 1] & 0x0f;
      const codeInt =
        ((digest[offset] & 0x7f) << 24) |
        ((digest[offset + 1] & 0xff) << 16) |
        ((digest[offset + 2] & 0xff) << 8) |
        (digest[offset + 3] & 0xff);
      return String(codeInt % 10 ** TOTP_DIGITS).padStart(TOTP_DIGITS, "0");
    }

    async function currentTotpCode() {
      const account = loadTotpAccount();
      if (!account?.secret) return "";
      return totpAt(account.secret);
    }

    function circleStoreLanIps() {
      try {
        const store = (window.SmCircleCrypto && SmCircleCrypto.loadStore()) || {};
        return Object.keys(store)
          .filter(isHomeLanIp)
          .sort((a, b) => {
            const ca = Number(store[a]?.createdAt || 0);
            const cb = Number(store[b]?.createdAt || 0);
            return cb - ca;
          });
      } catch (_) {
        return [];
      }
    }

    function extractLanFromText(text) {
      const found = [];
      const re = /\b(192\.168\.8\.(?:[2-9]|\d{2}|1\d{2}|2[0-4]\d|25[0-4]))\b/g;
      let m;
      while ((m = re.exec(String(text || "")))) {
        if (!found.includes(m[1])) found.push(m[1]);
      }
      return found;
    }

    async function detectHomeLanIpViaWebRtc() {
      return await new Promise((resolve) => {
        let done = false;
        const finish = (ip) => {
          if (done) return;
          done = true;
          try { pc.close(); } catch (_) {}
          resolve(ip || "");
        };
        let pc;
        try {
          pc = new RTCPeerConnection({ iceServers: [] });
        } catch (_) {
          resolve("");
          return;
        }
        try { pc.createDataChannel("sm"); } catch (_) {}
        const consider = (text) => {
          const ips = extractLanFromText(text);
          if (ips.length) finish(ips[0]);
        };
        pc.onicecandidate = (ev) => {
          if (!ev?.candidate) return;
          consider(ev.candidate.candidate || "");
          try { consider(JSON.stringify(ev.candidate)); } catch (_) {}
        };
        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer))
          .then(() => consider(pc.localDescription?.sdp || ""))
          .catch(() => finish(""));
        setTimeout(() => {
          consider(pc.localDescription?.sdp || "");
          finish("");
        }, 2800);
      });
    }

    function candidateEntries() {
      // After Authenticator TOTP unlock, show the full circle LAN roster.
      // Also include any local device keys for convenience.
      const byIp = new Map();
      const add = (ip, label) => {
        if (!isHomeLanIp(ip)) return;
        const prev = byIp.get(ip);
        byIp.set(ip, {
          ip,
          label: (label && label !== ip ? label : null) || prev?.label || ip,
        });
      };
      const member = !!(state?.circle_member || state?.circle_ok);
      if (member) {
        for (const row of state?.candidate_ips || []) {
          add(row.ip, row.label || row.ip);
        }
      }
      for (const ip of circleStoreLanIps()) add(ip, ip);
      for (const ip of bridgeIps) add(ip, ip);
      return [...byIp.values()].sort((a, b) =>
        String(a.label).localeCompare(String(b.label))
      );
    }

    function keysUrl() {
      const host = (state?.hosts?.keys || "keys.vpstruelord.com").replace(/^https?:\/\//, "");
      return `https://${host}/`;
    }

    function fillDevicePicker(selected) {
      const opts = candidateEntries();
      const member = !!(state?.circle_member || state?.circle_ok);
      els.deviceRow.hidden = !(member || opts.length || selected);
      if (!opts.length) {
        els.devicePick.innerHTML = member
          ? `<option value="">No circle LAN devices yet — Approve one in Authenticator</option>`
          : `<option value="">Authenticator required…</option>`;
      } else {
        els.devicePick.innerHTML =
          `<option value="">Select this device’s Wi‑Fi IP…</option>` +
          opts.map((row) => {
            const text = row.label && row.label !== row.ip
              ? `${row.label} — ${row.ip}`
              : row.ip;
            return `<option value="${row.ip}" ${row.ip === selected ? "selected" : ""}>${text}</option>`;
          }).join("");
      }
      if (selected && isHomeLanIp(selected)) {
        els.deviceManual.value = selected;
      }
      els.deviceManual.placeholder = member || opts.length
        ? "or type 192.168.8.x"
        : "Open Authenticator on this phone first";
      els.useDeviceBtn.disabled = !(member || opts.length);
    }

    function render() {
      if (!state) return;
      const ip = state.control_ip || (state.circle_ok ? lanIp : "") || "";
      const needsCircle = !!(state.needs_circle && !state.circle_member && !state.circle_ok);
      els.controlIp.textContent = ip
        || (needsCircle ? "circle required" : "pick this device");
      const bits = [];
      if (needsCircle) {
        bits.push(`Circle members only — open ${keysUrl()} Authenticator on this phone`);
      } else {
        if (state.via_flint) bits.push("via Flint VPN");
        if (state.client_ip && state.client_ip !== ip) bits.push(`connection ${state.client_ip}`);
        if (state.lan_ip) bits.push(`LAN ${state.lan_ip}`);
        if (state.provider_label && state.circle_ok) bits.push(`now: ${state.provider_label}`);
        if (state.global_exit) bits.push(`network default: ${state.global_exit}`);
        if (state.needs_device_ip && !state.circle_ok) {
          bits.push("pick this phone/computer’s home Wi‑Fi IP");
        }
      }
      els.meta.innerHTML = needsCircle
        ? `Circle members only. <a href="${keysUrl()}" style="color:var(--accent)">Open Authenticator</a> on this phone (enrolled secret required), then return here.`
        : (bits.join(" · ") || "Ready");
      fillDevicePicker(ip || lanIp);

      const prov = String(state.provider || "direct");
      els.btnTs.classList.toggle("active", prov === "tailscale");
      els.btnTs.classList.toggle("ts", prov === "tailscale");
      els.btnSs.classList.toggle("active", prov === "surfshark");
      els.btnDirect.classList.toggle("active", prov === "direct" || prov === "clear" || !prov);

      const servers = state.surfshark_servers || [];
      if (servers.length) {
        els.ssServer.hidden = false;
        const cur = state.surfshark_server || servers[0].id;
        els.ssServer.innerHTML = servers.map((s) =>
          `<option value="${s.id}" ${s.id === cur ? "selected" : ""}>${s.label || s.id}</option>`
        ).join("");
      } else {
        els.ssServer.hidden = true;
      }

      const canAct = !!(state.circle_ok && state.control_ip);
      els.choices.classList.toggle("busy", !canAct);
    }

    async function exitHeaders(extra, bodyText) {
      const headers = { Accept: "application/json", ...(extra || {}) };
      if (lanIp) headers["X-SM-Lan-Ip"] = lanIp;
      try {
        const code = await currentTotpCode();
        if (code) headers["X-SM-Totp"] = code;
      } catch (_) {}
      try {
        if (lanIp && window.SmCircleCrypto && SmCircleCrypto.getKeyForIp) {
          const row = await SmCircleCrypto.getKeyForIp(lanIp);
          if (row?.publicKey && row?.privateJwk) {
            const proof = await SmCircleCrypto.circleHeaders(lanIp, {
              method: headers["Content-Type"] ? "POST" : "GET",
              path: "/api/network/exit",
              bodyText: bodyText || "",
            });
            Object.assign(headers, proof);
          }
        }
      } catch (_) {}
      return headers;
    }

    async function refresh() {
      const headers = await exitHeaders();
      const res = await fetch("/api/network/exit", { headers, cache: "no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
      state = data;
      if (data.control_ip && isHomeLanIp(data.control_ip) && data.circle_ok) {
        lanIp = data.control_ip;
        rememberIp(lanIp);
      }
      render();
    }

    async function applyChosenDeviceIp(ip) {
      if (!isHomeLanIp(ip)) {
        toast("Choose a circle device IP (192.168.8.x)", true);
        return;
      }
      const hasLocalKey = !!(
        window.SmCircleCrypto &&
        (await SmCircleCrypto.getKeyForIp(ip))?.privateJwk
      );
      const hasTotp = !!loadTotpAccount()?.secret;
      if (!hasLocalKey && !hasTotp) {
        toast("Open Authenticator on this phone first (enrolled code required)", true);
        return;
      }
      lanIp = ip;
      rememberIp(ip);
      await refresh();
      if (state?.circle_ok && state?.control_ip === ip) toast(`Controlling ${ip}`);
      else if (state?.needs_circle && !state?.circle_member) {
        toast(state.error || "Circle proof failed", true);
      } else if (state?.circle_member && !state?.circle_ok) {
        toast(state.error || "That IP is not in the circle", true);
      }
    }

    async function setProvider(provider) {
      if (!lanIp && !state?.control_ip) {
        toast("Need this device’s 192.168.8.x IP first", true);
        return;
      }
      els.choices.classList.add("busy");
      try {
        const body = {
          provider,
          lan_ip: lanIp || state.control_ip || undefined,
        };
        if (provider === "surfshark" && els.ssServer.value) {
          body.server = els.ssServer.value;
        }
        if (provider === "tailscale" && state?.tailscale_exit_ip) {
          body.exit_ip = state.tailscale_exit_ip;
        }
        const bodyText = JSON.stringify(body);
        const headers = await exitHeaders(
          { "Content-Type": "application/json" },
          bodyText
        );
        if (!headers["X-SM-Circle-Sig"] && !headers["X-SM-Totp"]) {
          throw new Error("Open Authenticator on this phone first, then retry");
        }
        const res = await fetch("/api/network/exit", {
          method: "POST",
          headers,
          body: bodyText,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
        state = data;
        if (data.control_ip && isHomeLanIp(data.control_ip)) {
          lanIp = data.control_ip;
          rememberIp(lanIp);
        }
        render();
        toast(data.message || `Set ${provider}`);
      } catch (err) {
        toast(String(err?.message || err), true);
      } finally {
        els.choices.classList.remove("busy");
        render();
      }
    }

    els.devicePick.onchange = async () => {
      const ip = els.devicePick.value;
      if (!isHomeLanIp(ip)) return;
      els.deviceManual.value = ip;
      try {
        await applyChosenDeviceIp(ip);
      } catch (err) {
        toast(String(err?.message || err), true);
      }
    };

    els.useDeviceBtn.onclick = async () => {
      const typed = String(els.deviceManual.value || "").trim();
      const picked = String(els.devicePick.value || "").trim();
      try {
        await applyChosenDeviceIp(typed || picked);
      } catch (err) {
        toast(String(err?.message || err), true);
      }
    };

    els.btnTs.onclick = () => setProvider("tailscale");
    els.btnSs.onclick = () => setProvider("surfshark");
    els.btnDirect.onclick = () => setProvider("direct");

    function onKeysOrigin() {
      const host = String(location.hostname || "").toLowerCase();
      return host === "keys.vpstruelord.com" || host.startsWith("keys.");
    }

    function authAppHref() {
      const ua = navigator.userAgent || "";
      if (/iPhone|iPad|iPod/i.test(ua)) return "/auth-app-iphone.html";
      return "/auth-app.html";
    }
    try {
      const back = document.getElementById("backAuth");
      if (back) back.href = authAppHref();
    } catch (_) {}

    function loadKeysBridge() {
      if (onKeysOrigin()) {
        bridgeIps = circleStoreLanIps();
        return Promise.resolve(bridgeIps);
      }
      return new Promise((resolve) => {
        const keysHost = (state?.hosts?.keys || "keys.vpstruelord.com").replace(/^https?:\/\//, "");
        let settled = false;
        const done = (ips) => {
          if (settled) return;
          settled = true;
          bridgeIps = (ips || []).filter(isHomeLanIp);
          window.removeEventListener("message", onMsg);
          try { iframe.remove(); } catch (_) {}
          resolve(bridgeIps);
        };
        const onMsg = (ev) => {
          const data = ev?.data;
          if (!data || data.type !== "sm-network-lan-ips") return;
          const originHost = String(ev.origin || "").replace(/^https?:\/\//, "");
          if (originHost && originHost !== keysHost && !originHost.endsWith(".vpstruelord.com")) {
            return;
          }
          try {
            if (data.keys && window.SmCircleCrypto?.mergeStore) {
              SmCircleCrypto.mergeStore(data.keys);
            }
          } catch (_) {}
          done(Array.isArray(data.ips) ? data.ips : Object.keys(data.keys || {}));
        };
        window.addEventListener("message", onMsg);
        const iframe = document.createElement("iframe");
        iframe.title = "lan-bridge";
        iframe.style.cssText = "position:absolute;width:0;height:0;border:0;opacity:0";
        iframe.src = `https://${keysHost}/static/network-lan-bridge.html`;
        document.body.appendChild(iframe);
        setTimeout(() => done(bridgeIps), 1500);
      });
    }

    function pickBestLanIp(allowed) {
      const allow = allowed instanceof Set ? allowed : new Set(allowed || []);
      const webrtcPromise = detectHomeLanIpViaWebRtc();
      return webrtcPromise.then((webrtc) => {
        if (isHomeLanIp(webrtc) && (!allow.size || allow.has(webrtc))) return webrtc;
        const remembered = rememberedIp();
        if (remembered && (!allow.size || allow.has(remembered))) return remembered;
        const circleIps = circleStoreLanIps().filter((ip) => !allow.size || allow.has(ip));
        if (circleIps.length) return circleIps[0];
        if (allow.size === 1) return [...allow][0];
        return "";
      });
    }

    (async () => {
      try {
        // Circle keys + Authenticator TOTP live on keys.* localStorage.
        if (!onKeysOrigin()) {
          location.replace("https://keys.vpstruelord.com/network.html");
          return;
        }
        state = {
          hosts: { keys: "keys.vpstruelord.com", network: "network.vpstruelord.com" },
          needs_circle: true,
          circle_ok: false,
          circle_member: false,
          candidate_ips: [],
        };
        render();
        await loadKeysBridge();
        // First probe with TOTP (and any local key) so the server can unlock the roster.
        await refresh();
        const allowed = new Set(
          (state?.candidate_ips || []).map((r) => r.ip).filter(isHomeLanIp)
        );
        for (const ip of circleStoreLanIps()) allowed.add(ip);
        const best = await pickBestLanIp(allowed);
        if (best) {
          lanIp = best;
          rememberIp(lanIp);
          await refresh();
        }
        if (state?.needs_circle && !state?.circle_member && !state?.circle_ok) {
          const hasTotp = !!loadTotpAccount()?.secret;
          toast(
            hasTotp
              ? "Authenticator code rejected — unlock Authenticator, then hard-refresh"
              : "Open Authenticator on this phone and enroll first, then return here",
            true
          );
          els.deviceRow.hidden = false;
          fillDevicePicker(lanIp);
        } else if (state?.circle_member && !state?.circle_ok) {
          toast("Pick this device’s home Wi‑Fi IP below", false);
          els.deviceRow.hidden = false;
          fillDevicePicker(lanIp);
        }
      } catch (err) {
        els.controlIp.textContent = "unavailable";
        els.meta.textContent = String(err?.message || err);
        fillDevicePicker(lanIp);
        toast(String(err?.message || err), true);
      }
    })();
  </script>
</body>
</html>
