<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Files</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0a0f0d;
      --bg1: #111916;
      --bg2: #17221d;
      --bg3: #1e2b25;
      --line: rgba(170, 210, 185, 0.12);
      --text: #e8f2ec;
      --muted: #84998c;
      --accent: #3ddea0;
      --accent-dim: rgba(61, 222, 160, 0.14);
      --accent-strong: rgba(61, 222, 160, 0.35);
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; width: 100%;
      background: var(--bg0); color: var(--text);
      font-family: "Sora", system-ui, sans-serif;
      overflow: hidden;
    }
    button, input { font: inherit; }
    .ftp-shell {
      display: grid; grid-template-columns: 240px 1fr;
      height: 100%; min-height: 0;
      background:
        radial-gradient(900px 420px at 0% 0%, rgba(61,222,160,.07), transparent 55%),
        var(--bg1);
    }
    .ftp-side {
      border-right: 1px solid var(--line);
      background: rgba(10,15,13,.45);
      padding: 16px 12px;
      display: flex; flex-direction: column; gap: 8px;
      overflow: auto;
    }
    .ftp-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px 14px; font-weight: 700; font-size: .95rem;
    }
    .ftp-brand svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 2; }
    .ftp-new {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      margin: 0 4px 10px; padding: 12px 14px; border-radius: 999px;
      border: 0; cursor: pointer; font-weight: 700;
      background: var(--accent); color: #062016;
    }
    .ftp-new:hover { filter: brightness(1.05); }
    .ftp-side-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 999px; border: 0; cursor: pointer;
      background: transparent; color: var(--muted); font-weight: 600;
      text-align: left; width: 100%;
    }
    .ftp-side-link:hover { background: rgba(255,255,255,.05); color: var(--text); }
    .ftp-side-link.active {
      background: var(--accent-dim); color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent-strong);
    }
    .ftp-side-link svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; flex: 0 0 auto; }
    .ftp-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .ftp-top {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
    }
    .ftp-search {
      flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.04); border: 1px solid var(--line);
      border-radius: 999px; padding: 0 14px; height: 42px;
    }
    .ftp-search svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
    .ftp-search input {
      flex: 1; border: 0; outline: none; background: transparent; color: var(--text);
      font-size: .92rem; min-width: 0;
    }
    .ftp-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .ftp-actions button {
      border: 1px solid var(--line); background: rgba(255,255,255,.03);
      color: var(--text); border-radius: 10px; padding: 8px 12px;
      font-size: .8rem; font-weight: 600; cursor: pointer;
    }
    .ftp-actions button:hover:not(:disabled) {
      background: var(--accent-dim); border-color: var(--accent-strong); color: var(--accent);
    }
    .ftp-actions button:disabled { opacity: .4; cursor: not-allowed; }
    .ftp-crumbs {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      padding: 8px 16px 12px; color: var(--muted); font-size: .82rem; font-weight: 600;
    }
    .ftp-crumbs button {
      border: 0; background: transparent; color: inherit; cursor: pointer;
      padding: 4px 8px; border-radius: 8px;
    }
    .ftp-crumbs button:hover { background: rgba(255,255,255,.06); color: var(--text); }
    .ftp-crumbs .sep { opacity: .5; }
    .ftp-status { margin-left: auto; font-size: .75rem; color: var(--muted); font-weight: 500; }
    .ftp-grid {
      flex: 1; min-height: 0; overflow: auto; padding: 8px 12px 20px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 8px; align-content: start;
    }
    .ftp-card {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 10px 12px; border-radius: 16px; border: 1px solid transparent;
      background: transparent; cursor: pointer; color: var(--text); text-align: center;
      user-select: none;
    }
    .ftp-card:hover { background: rgba(255,255,255,.045); border-color: var(--line); }
    .ftp-card.selected {
      background: var(--accent-dim); border-color: var(--accent-strong);
    }
    .ftp-card .ico { width: 64px; height: 52px; display: grid; place-items: center; }
    .ftp-card .ico svg { width: 56px; height: 48px; }
    .ftp-card .name {
      font-size: .78rem; font-weight: 600; line-height: 1.3;
      max-width: 100%; overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word;
    }
    .ftp-card .meta { font-size: .68rem; color: var(--muted); }
    .ftp-empty, .ftp-error {
      grid-column: 1 / -1; padding: 48px 16px; text-align: center; color: var(--muted);
    }
    .ftp-error { color: #ff8f8f; }
    .ftp-toast {
      position: fixed; right: 16px; bottom: 16px; z-index: 20;
      background: var(--bg3); border: 1px solid var(--line); color: var(--text);
      border-radius: 12px; padding: 10px 14px; font-size: .82rem; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    .ftp-toast.show { opacity: 1; }
    .ftp-toast.err { color: #ffb4b4; border-color: rgba(255,107,107,.35); }
    .ftp-viewer {
      position: fixed; inset: 0; z-index: 40; display: none;
      flex-direction: column;
      background: rgba(10,15,13,.96);
    }
    .ftp-viewer.open { display: flex; }
    .ftp-viewer-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
      background: var(--bg1);
    }
    .ftp-viewer-bar .title {
      flex: 1; min-width: 120px; font-weight: 700; font-size: .92rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ftp-viewer-bar button {
      border: 1px solid var(--line); background: rgba(255,255,255,.04);
      color: var(--text); border-radius: 10px; padding: 8px 12px;
      font-size: .8rem; font-weight: 600; cursor: pointer;
    }
    .ftp-viewer-bar button.primary {
      background: var(--accent); color: #062016; border-color: transparent;
    }
    .ftp-viewer-body {
      flex: 1; min-height: 0; display: grid; place-items: center;
      padding: 12px; overflow: auto;
    }
    .ftp-viewer-body img,
    .ftp-viewer-body video {
      max-width: 100%; max-height: 100%; border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,.45);
    }
    .ftp-viewer-body audio { width: min(560px, 100%); }
    .ftp-viewer-body iframe {
      width: 100%; height: 100%; border: 0; border-radius: 12px; background: #fff;
    }
    .ftp-viewer-body pre {
      margin: 0; width: 100%; max-width: 960px; max-height: 100%;
      overflow: auto; padding: 16px 18px; border-radius: 12px;
      background: var(--bg2); border: 1px solid var(--line);
      color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .82rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    }
    .ftp-viewer-fallback {
      text-align: center; color: var(--muted); max-width: 36ch; line-height: 1.45;
    }
    @media (max-width: 900px) {
      .ftp-shell { grid-template-columns: 1fr; }
      .ftp-side { display: none; }
    }
  </style>
</head>
<body>
  <div class="ftp-shell">
    <aside class="ftp-side">
      <div class="ftp-brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>
        <span>My Drive</span>
      </div>
      <button type="button" class="ftp-new" id="ftpNewBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New
      </button>
      <button type="button" class="ftp-side-link active" data-ftp-root="/disk1" id="ftpNavDrive">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>
        My Drive
      </button>
      <button type="button" class="ftp-side-link" data-ftp-root="/" id="ftpNavRoot">
        <svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M4 7l2-3h12l2 3"/></svg>
        All disks
      </button>
    </aside>
    <div class="ftp-main">
      <div class="ftp-top">
        <label class="ftp-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="ftpSearch" type="search" placeholder="Search in current folder" autocomplete="off" />
        </label>
        <div class="ftp-actions">
          <button type="button" id="ftpUploadBtn">Upload</button>
          <button type="button" id="ftpMkdirBtn">New folder</button>
          <button type="button" id="ftpOpenBtn" disabled>Open</button>
          <button type="button" id="ftpDownloadBtn" disabled>Download</button>
          <button type="button" id="ftpRenameBtn" disabled>Rename</button>
          <button type="button" id="ftpDeleteBtn" disabled>Delete</button>
          <button type="button" id="ftpRefreshBtn">Refresh</button>
        </div>
        <input type="file" id="ftpFileInput" multiple hidden />
      </div>
      <div class="ftp-crumbs" id="ftpCrumbs"></div>
      <div class="ftp-grid" id="ftpGrid"><div class="ftp-empty">Loading…</div></div>
    </div>
  </div>
  <div class="ftp-toast" id="ftpToast"></div>
  <div class="ftp-viewer" id="ftpViewer" aria-hidden="true">
    <div class="ftp-viewer-bar">
      <div class="title" id="ftpViewerTitle">File</div>
      <button type="button" class="primary" id="ftpViewerDownload">Download</button>
      <button type="button" id="ftpViewerClose">Close</button>
    </div>
    <div class="ftp-viewer-body" id="ftpViewerBody"></div>
  </div>

  <script>
    const FTP_FOLDER_SVG = `<svg viewBox="0 0 64 52" fill="none" aria-hidden="true"><path d="M2 12c0-3.3 2.7-6 6-6h14l4 4h30c3.3 0 6 2.7 6 6v28c0 3.3-2.7 6-6 6H8c-3.3 0-6-2.7-6-6V12z" fill="rgba(61,222,160,.18)" stroke="#3ddea0" stroke-width="2"/><path d="M2 18h60" stroke="#3ddea0" stroke-opacity=".35" stroke-width="2"/></svg>`;
    const FTP_FILE_SVG = `<svg viewBox="0 0 48 56" fill="none" aria-hidden="true"><path d="M10 2h20l14 14v34a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z" fill="rgba(232,242,236,.06)" stroke="#84998c" stroke-width="2"/><path d="M30 2v14h14" stroke="#84998c" stroke-width="2"/></svg>`;

    let ftpPath = "/disk1";
    let ftpEntries = [];
    let ftpSelected = null;
    let ftpQuery = "";

    function esc(v) {
      return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function toast(msg, kind) {
      const el = document.getElementById("ftpToast");
      el.textContent = msg;
      el.classList.toggle("err", kind === "err");
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2400);
    }

    async function api(url, opts) {
      const res = await fetch(url, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(opts && opts.headers) },
        ...opts,
      });
      if (res.status === 401) {
        try { window.top.location.href = "/login.html"; } catch (e) { location.href = "/login.html"; }
        throw new Error("Not signed in");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) throw new Error(data.error || data.message || ("HTTP " + res.status));
      return data;
    }

    function ftpFmtSize(n) {
      const x = Number(n) || 0;
      if (x < 1024) return x + " B";
      if (x < 1048576) return (x / 1024).toFixed(1) + " KB";
      if (x < 1073741824) return (x / 1048576).toFixed(1) + " MB";
      return (x / 1073741824).toFixed(2) + " GB";
    }
    function ftpFmtTime(s) {
      const m = String(s || "");
      if (m.length >= 12) return m.slice(0,4)+"-"+m.slice(4,6)+"-"+m.slice(6,8);
      return "";
    }
    function ftpParentPath(p) {
      const parts = String(p || "/").split("/").filter(Boolean);
      parts.pop();
      return parts.length ? "/" + parts.join("/") : "/";
    }

    function ftpSetSelected(entry) {
      ftpSelected = entry || null;
      const has = !!ftpSelected;
      const isFile = has && ftpSelected.type === "file";
      const isDir = has && ftpSelected.type === "dir";
      document.getElementById("ftpOpenBtn").disabled = !has;
      document.getElementById("ftpDownloadBtn").disabled = !isFile;
      document.getElementById("ftpRenameBtn").disabled = !has;
      document.getElementById("ftpDeleteBtn").disabled = !has;
      document.querySelectorAll(".ftp-card").forEach((el) => {
        el.classList.toggle("selected", has && el.getAttribute("data-path") === ftpSelected.path);
      });
    }

    function ftpFileKind(name) {
      const n = String(name || "").toLowerCase();
      const ext = (n.split(".").pop() || "");
      if (["png","jpg","jpeg","gif","webp","bmp","svg","avif","ico"].includes(ext)) return "image";
      if (["mp4","webm","ogg","mov","m4v"].includes(ext)) return "video";
      if (["mp3","wav","flac","m4a","aac","oga"].includes(ext)) return "audio";
      if (ext === "pdf") return "pdf";
      if (["txt","md","markdown","log","json","csv","tsv","xml","html","htm","css","js","ts","tsx","jsx","py","sh","conf","cfg","ini","env","yaml","yml","toml","c","cpp","h","java","go","rs","rb","php","sql"].includes(ext)) return "text";
      return "other";
    }

    function ftpInlineUrl(entry) {
      return "/api/ftp/download?path=" + encodeURIComponent(entry.path) + "&inline=1";
    }

    function ftpCloseViewer() {
      const viewer = document.getElementById("ftpViewer");
      const body = document.getElementById("ftpViewerBody");
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
      body.innerHTML = "";
      ftpViewerEntry = null;
    }

    let ftpViewerEntry = null;

    async function ftpOpenFile(entry) {
      if (!entry || entry.type !== "file") return;
      ftpSetSelected(entry);
      const kind = ftpFileKind(entry.name);
      const url = ftpInlineUrl(entry);
      const viewer = document.getElementById("ftpViewer");
      const body = document.getElementById("ftpViewerBody");
      const title = document.getElementById("ftpViewerTitle");
      ftpViewerEntry = entry;
      title.textContent = entry.name;
      body.innerHTML = `<div class="ftp-empty">Opening…</div>`;
      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");

      try {
        if (kind === "image") {
          body.innerHTML = `<img src="${esc(url)}" alt="${esc(entry.name)}" />`;
          return;
        }
        if (kind === "video") {
          body.innerHTML = `<video controls autoplay src="${esc(url)}"></video>`;
          return;
        }
        if (kind === "audio") {
          body.innerHTML = `<audio controls autoplay src="${esc(url)}"></audio>`;
          return;
        }
        if (kind === "pdf") {
          body.innerHTML = `<iframe title="${esc(entry.name)}" src="${esc(url)}"></iframe>`;
          return;
        }
        if (kind === "text") {
          const res = await fetch(url, { credentials: "same-origin" });
          if (!res.ok) throw new Error("Could not open file");
          const text = await res.text();
          const clipped = text.length > 800000 ? text.slice(0, 800000) + "\n\n… (truncated)" : text;
          body.innerHTML = `<pre>${esc(clipped)}</pre>`;
          return;
        }
        body.innerHTML = `<div class="ftp-viewer-fallback">This file type can’t be previewed in the browser.<br/>Use Download to save it.</div>`;
      } catch (err) {
        body.innerHTML = `<div class="ftp-error">${esc(String(err.message || err))}</div>`;
        toast(String(err.message || err), "err");
      }
    }

    function ftpOpenSelected() {
      if (!ftpSelected) return;
      if (ftpSelected.type === "dir") ftpBrowse(ftpSelected.path);
      else ftpOpenFile(ftpSelected);
    }

    function ftpRenderCrumbs(data) {
      const el = document.getElementById("ftpCrumbs");
      const bits = [`<button type="button" data-path="/">NAS</button>`];
      (data.crumbs || []).forEach((c) => {
        bits.push(`<span class="sep">/</span>`);
        bits.push(`<button type="button" data-path="${esc(c.path)}">${esc(c.name)}</button>`);
      });
      el.innerHTML = bits.join("") + `<span class="ftp-status" id="ftpStatusLine"></span>`;
      el.querySelectorAll("button[data-path]").forEach((b) => {
        b.addEventListener("click", () => ftpBrowse(b.getAttribute("data-path")));
      });
    }

    function ftpRenderGrid() {
      const grid = document.getElementById("ftpGrid");
      const q = ftpQuery.trim().toLowerCase();
      const list = ftpEntries.filter((e) => !q || e.name.toLowerCase().includes(q));
      if (!list.length) {
        grid.innerHTML = `<div class="ftp-empty">${q ? "No matches" : "This folder is empty"}</div>`;
        return;
      }
      grid.innerHTML = list.map((e) => {
        const meta = e.type === "dir" ? "Folder" : ftpFmtSize(e.size);
        const when = ftpFmtTime(e.modified);
        return `<button type="button" class="ftp-card" data-path="${esc(e.path)}" data-type="${esc(e.type)}" title="${esc(e.name)}">
          <div class="ico">${e.type === "dir" ? FTP_FOLDER_SVG : FTP_FILE_SVG}</div>
          <div class="name">${esc(e.name)}</div>
          <div class="meta">${esc(meta)}${when ? " · " + esc(when) : ""}</div>
        </button>`;
      }).join("");

      grid.querySelectorAll(".ftp-card").forEach((card) => {
        const path = card.getAttribute("data-path");
        const entry = ftpEntries.find((e) => e.path === path);
        card.addEventListener("click", (ev) => {
          ev.preventDefault();
          if (!entry) return;
          // Folders: follow through on first click (Drive-like open).
          if (entry.type === "dir") {
            ftpSetSelected(entry);
            ftpBrowse(entry.path);
            return;
          }
          // Files: first click selects; click again opens in viewer.
          if (ftpSelected && ftpSelected.path === entry.path) {
            ftpOpenFile(entry);
            return;
          }
          ftpSetSelected(entry);
        });
        card.addEventListener("dblclick", (ev) => {
          ev.preventDefault();
          if (!entry) return;
          if (entry.type === "dir") ftpBrowse(entry.path);
          else ftpOpenFile(entry);
        });
      });

      if (ftpSelected) {
        const still = ftpEntries.find((e) => e.path === ftpSelected.path) || null;
        ftpSetSelected(still);
      }
    }

    async function ftpBrowse(path) {
      ftpPath = path || "/";
      ftpSetSelected(null);
      const grid = document.getElementById("ftpGrid");
      grid.innerHTML = `<div class="ftp-empty">Loading…</div>`;
      try {
        const data = await api("/api/ftp/list?path=" + encodeURIComponent(ftpPath));
        ftpPath = data.path;
        ftpEntries = data.entries || [];
        ftpRenderCrumbs(data);
        ftpRenderGrid();
        document.querySelectorAll(".ftp-side-link").forEach((b) => {
          const root = b.getAttribute("data-ftp-root");
          const onDrive = root === "/disk1" && (ftpPath === "/disk1" || ftpPath.startsWith("/disk1/"));
          b.classList.toggle("active", root === ftpPath || onDrive);
        });
        const st = document.getElementById("ftpStatusLine");
        if (st) st.textContent = ftpEntries.length + " items";
        toast(ftpPath);
      } catch (err) {
        grid.innerHTML = `<div class="ftp-error">${esc(String(err.message || err))}</div>`;
        toast(String(err.message || err), "err");
      }
    }

    async function ftpMkdir() {
      const name = prompt("New folder name");
      if (!name) return;
      const dest = (ftpPath.replace(/\/$/, "") || "") + "/" + name.trim().replace(/^\/+|\/+$/g, "");
      try {
        toast("Creating folder…");
        await api("/api/ftp/mkdir", { method: "POST", body: JSON.stringify({ path: dest }) });
        await ftpBrowse(ftpPath);
        toast("Folder created");
      } catch (err) {
        toast(String(err.message || err), "err");
      }
    }

    async function ftpUploadFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      for (const file of files) {
        const dest = (ftpPath.replace(/\/$/, "") || "") + "/" + file.name;
        toast("Uploading " + file.name + "…");
        const res = await fetch("/api/ftp/upload?path=" + encodeURIComponent(dest), {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/octet-stream" },
          body: file,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.error || ("upload failed: " + file.name));
      }
      await ftpBrowse(ftpPath);
      toast("Upload complete");
    }

    function ftpDownload(entry) {
      if (!entry || entry.type !== "file") return;
      const a = document.createElement("a");
      a.href = "/api/ftp/download?path=" + encodeURIComponent(entry.path);
      a.download = entry.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast("Downloading " + entry.name);
    }

    async function ftpRename() {
      if (!ftpSelected) return;
      const next = prompt("Rename to", ftpSelected.name);
      if (!next || next === ftpSelected.name) return;
      const dst = ftpParentPath(ftpSelected.path) + "/" + next.trim();
      try {
        toast("Renaming…");
        await api("/api/ftp/rename", { method: "POST", body: JSON.stringify({ src: ftpSelected.path, dst }) });
        await ftpBrowse(ftpPath);
        toast("Renamed");
      } catch (err) {
        toast(String(err.message || err), "err");
      }
    }

    async function ftpDelete() {
      if (!ftpSelected) return;
      if (!confirm("Delete " + ftpSelected.name + "?")) return;
      try {
        toast("Deleting…");
        await api("/api/ftp/delete", { method: "POST", body: JSON.stringify({ path: ftpSelected.path }) });
        await ftpBrowse(ftpPath);
        toast("Deleted");
      } catch (err) {
        toast(String(err.message || err), "err");
      }
    }

    function bindFtpUi() {
      document.getElementById("ftpRefreshBtn").addEventListener("click", () => ftpBrowse(ftpPath));
      document.getElementById("ftpMkdirBtn").addEventListener("click", () => ftpMkdir());
      document.getElementById("ftpNewBtn").addEventListener("click", () => ftpMkdir());
      document.getElementById("ftpOpenBtn").addEventListener("click", () => ftpOpenSelected());
      document.getElementById("ftpUploadBtn").addEventListener("click", () => document.getElementById("ftpFileInput").click());
      document.getElementById("ftpFileInput").addEventListener("change", async (e) => {
        try { await ftpUploadFiles(e.target.files); }
        catch (err) { toast(String(err.message || err), "err"); }
        e.target.value = "";
      });
      document.getElementById("ftpDownloadBtn").addEventListener("click", () => ftpDownload(ftpSelected));
      document.getElementById("ftpRenameBtn").addEventListener("click", () => ftpRename());
      document.getElementById("ftpDeleteBtn").addEventListener("click", () => ftpDelete());
      document.getElementById("ftpViewerClose").addEventListener("click", () => ftpCloseViewer());
      document.getElementById("ftpViewerDownload").addEventListener("click", () => {
        if (ftpViewerEntry) ftpDownload(ftpViewerEntry);
      });
      document.getElementById("ftpSearch").addEventListener("input", (e) => {
        ftpQuery = e.target.value || "";
        ftpRenderGrid();
      });
      document.querySelectorAll(".ftp-side-link").forEach((b) => {
        b.addEventListener("click", () => ftpBrowse(b.getAttribute("data-ftp-root") || "/disk1"));
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.getElementById("ftpViewer").classList.contains("open")) {
          e.preventDefault();
          ftpCloseViewer();
          return;
        }
        if (e.key === "Enter") ftpOpenSelected();
        if (e.key === "Backspace" && !(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA"))) {
          if (document.getElementById("ftpViewer").classList.contains("open")) return;
          e.preventDefault();
          if (ftpPath !== "/") ftpBrowse(ftpParentPath(ftpPath));
        }
      });
    }

    bindFtpUi();
    ftpBrowse("/disk1");
  </script>
</body>
</html>
