<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in · ServerManager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #101a16;
      --bg1: #17231e;
      --line: rgba(170, 210, 185, 0.18);
      --text: #eef5f1;
      --muted: #8fa497;
      --accent: #3ddea0;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Sora", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: max(12vh, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(820px 420px at 20% 0%, rgba(61, 222, 160, 0.1), transparent 55%),
        linear-gradient(180deg, #121c18 0%, var(--bg0) 55%, #0f1814 100%);
    }
    .shell {
      width: min(400px, 100%);
    }
    .card {
      border-radius: 18px;
      background: var(--bg1);
      border: 1px solid var(--line);
      padding: 32px 26px 24px;
      box-shadow: 0 12px 28px rgba(0,0,0,.22);
    }
    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3.6vw, 1.85rem);
      letter-spacing: -.03em;
      line-height: 1.15;
      font-weight: 700;
      text-align: center;
    }

    form { margin-top: 24px; display: grid; gap: 14px; }
    label {
      display: grid; gap: 7px;
      font-size: .78rem; color: var(--muted); letter-spacing: .02em;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      font: inherit;
      font-size: 16px;
      min-height: 48px;
      outline: none;
    }
    input:focus {
      border-color: rgba(61,222,160,.5);
      box-shadow: 0 0 0 3px rgba(61,222,160,.1);
    }
    button {
      margin-top: 6px;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      color: #062016;
      background: linear-gradient(145deg, #4aefb0, #2bb984);
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: .55; cursor: wait; }
    .err {
      min-height: 1.2em;
      margin: 0;
      color: var(--danger);
      font-size: .82rem;
      font-family: "IBM Plex Mono", monospace;
    }

  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1 id="title">ServerManager</h1>
      <form id="form" autocomplete="on">
        <label>Username
          <input id="user" name="username" autocomplete="username" required autofocus />
        </label>
        <label>Password
          <input id="pass" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="err" id="err" aria-live="polite"></p>
        <button type="submit" id="btn">Sign in</button>
      </form>
    </div>
  </div>
  <script>
    async function loadBrand() {
      try {
        const res = await fetch("/api/branding");
        const data = await res.json();
        if (data.title) {
          document.getElementById("title").textContent = data.title;
          document.title = "Sign in · " + data.title;
        }
      } catch (_) {}
    }
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn");
      const err = document.getElementById("err");
      err.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("user").value.trim(),
            password: document.getElementById("pass").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Login failed");
        location.href = "/";
      } catch (ex) {
        err.textContent = ex.message || "Login failed";
        btn.disabled = false;
      }
    });
    loadBrand();
  </script>
</body>
</html>
