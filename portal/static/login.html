<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in · ServerManager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #07110d;
      --bg1: #0e1a15;
      --line: rgba(170, 210, 185, 0.14);
      --text: #e7f1eb;
      --muted: #7f9689;
      --accent: #3ddea0;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Sora", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: max(14vh, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(61, 222, 160, 0.16), transparent 55%),
        radial-gradient(700px 420px at 90% 85%, rgba(40, 120, 90, 0.22), transparent 50%),
        linear-gradient(160deg, #050a08 0%, var(--bg0) 45%, #0a1511 100%);
    }
    .shell {
      width: min(420px, 100%);
      position: relative;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(61,222,160,.45), transparent 40%, rgba(61,222,160,.12));
      z-index: 0;
      opacity: .7;
    }
    .card {
      position: relative;
      z-index: 1;
      margin: 1px;
      border-radius: 21px;
      background: color-mix(in srgb, var(--bg1) 92%, black);
      border: 1px solid var(--line);
      padding: 36px 28px 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.05rem);
      letter-spacing: -.04em;
      line-height: 1.1;
      font-weight: 700;
      text-align: center;
    }
    .sub {
      margin: 10px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.4;
      display: none;
    }
    .sub.show { display: block; }
    form { margin-top: 28px; display: grid; gap: 14px; }
    label {
      display: grid; gap: 7px;
      font-size: .78rem; color: var(--muted); letter-spacing: .02em;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      font: inherit;
      font-size: 16px;
      min-height: 48px;
      outline: none;
    }
    input:focus {
      border-color: rgba(61,222,160,.55);
      box-shadow: 0 0 0 3px rgba(61,222,160,.12);
    }
    #codeWrap input {
      text-align: center;
      letter-spacing: .28em;
      font-family: "IBM Plex Mono", monospace;
      font-size: 1.15rem;
    }
    #codeWrap { display: none; }
    #codeWrap.show { display: grid; gap: 7px; }
    #credsWrap.show { display: contents; }
    #credsWrap.hide { display: none; }
    button {
      margin-top: 6px;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      color: #062016;
      background: linear-gradient(145deg, #4aefb0, #2bb984);
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: .55; cursor: wait; }
    .ghost {
      margin-top: 0;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      display: none;
    }
    .ghost.show { display: block; }
    .err {
      min-height: 1.2em;
      margin: 0;
      color: var(--danger);
      font-size: .82rem;
      font-family: "IBM Plex Mono", monospace;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1 id="title">ServerManager</h1>
      <p class="sub" id="sub"></p>
      <form id="form" autocomplete="on">
        <div id="credsWrap" class="show">
          <label>Username
            <input id="user" name="username" autocomplete="username" required autofocus />
          </label>
          <label>Password
            <input id="pass" name="password" type="password" autocomplete="current-password" required />
          </label>
        </div>
        <label id="codeWrap">Authenticator code
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••" />
        </label>
        <p class="err" id="err" aria-live="polite"></p>
        <button type="submit" id="btn">Sign in</button>
        <button type="button" class="ghost" id="passkeyBtn">Use passkey</button>
        <button type="button" class="ghost" id="backBtn">Back</button>
      </form>
    </div>
  </div>
  <script>
    let loginToken = "";
    let twoFactorMethod = "app";
    let passkeyAvailable = false;

    function b64urlToBuf(b64url) {
      const pad = "=".repeat((4 - (b64url.length % 4)) % 4);
      const b64 = (b64url + pad).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(b64);
      const out = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out.buffer;
    }
    function bufToB64url(buf) {
      const bytes = new Uint8Array(buf);
      let s = "";
      for (const b of bytes) s += String.fromCharCode(b);
      return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }
    function publicKeyFromJson(options) {
      const o = structuredClone(options);
      o.challenge = b64urlToBuf(o.challenge);
      if (o.allowCredentials) {
        o.allowCredentials = o.allowCredentials.map((c) => ({
          ...c,
          id: b64urlToBuf(c.id),
        }));
      }
      return o;
    }

    async function loadBrand() {
      try {
        const res = await fetch("/api/branding");
        const data = await res.json();
        if (data.title) {
          document.getElementById("title").textContent = data.title;
          document.title = "Sign in · " + data.title;
        }
      } catch (_) {}
    }

    function showCodeStep(method, message, passkeyOk) {
      twoFactorMethod = method || "app";
      passkeyAvailable = !!passkeyOk;
      document.getElementById("credsWrap").className = "hide";
      document.getElementById("user").required = false;
      document.getElementById("pass").required = false;
      const wrap = document.getElementById("codeWrap");
      wrap.classList.add("show");
      wrap.childNodes[0].textContent =
        twoFactorMethod === "email" ? "Email code" : "Authenticator code";
      const sub = document.getElementById("sub");
      sub.textContent = message || (twoFactorMethod === "email"
        ? "Enter the portal sign-in code from your email."
        : "Enter a fresh Authenticator code for portal sign-in.");
      sub.classList.add("show");
      document.getElementById("btn").textContent = "Verify & sign in";
      document.getElementById("backBtn").classList.add("show");
      const pk = document.getElementById("passkeyBtn");
      if (passkeyAvailable && window.PublicKeyCredential) pk.classList.add("show");
      else pk.classList.remove("show");
      const code = document.getElementById("code");
      code.value = "";
      code.focus();
    }

    function showPasswordStep() {
      loginToken = "";
      passkeyAvailable = false;
      document.getElementById("credsWrap").className = "show";
      document.getElementById("user").required = true;
      document.getElementById("pass").required = true;
      document.getElementById("codeWrap").classList.remove("show");
      document.getElementById("sub").classList.remove("show");
      document.getElementById("btn").textContent = "Sign in";
      document.getElementById("backBtn").classList.remove("show");
      document.getElementById("passkeyBtn").classList.remove("show");
      document.getElementById("pass").focus();
    }

    document.getElementById("backBtn").addEventListener("click", () => {
      showPasswordStep();
      document.getElementById("err").textContent = "";
    });

    document.getElementById("passkeyBtn").addEventListener("click", async () => {
      const err = document.getElementById("err");
      const btn = document.getElementById("passkeyBtn");
      err.textContent = "";
      btn.disabled = true;
      try {
        if (!loginToken) throw new Error("Sign in with password first");
        const optRes = await fetch("/api/login/passkey-options", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login_token: loginToken }),
        });
        const optData = await optRes.json().catch(() => ({}));
        if (!optRes.ok) throw new Error(optData.error || "Passkey options failed");
        const assertion = await navigator.credentials.get({
          publicKey: publicKeyFromJson(optData.options),
        });
        const cred = {
          id: assertion.id,
          rawId: bufToB64url(assertion.rawId),
          type: assertion.type,
          response: {
            clientDataJSON: bufToB64url(assertion.response.clientDataJSON),
            authenticatorData: bufToB64url(assertion.response.authenticatorData),
            signature: bufToB64url(assertion.response.signature),
            userHandle: assertion.response.userHandle
              ? bufToB64url(assertion.response.userHandle)
              : null,
          },
        };
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login_token: loginToken, passkey: cred }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Passkey login failed");
        location.href = "/";
      } catch (ex) {
        err.textContent = ex.message || "Passkey failed";
        btn.disabled = false;
      }
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn");
      const err = document.getElementById("err");
      err.textContent = "";
      btn.disabled = true;
      try {
        const body = loginToken
          ? {
              login_token: loginToken,
              code: document.getElementById("code").value.trim(),
            }
          : {
              username: document.getElementById("user").value.trim(),
              password: document.getElementById("pass").value,
            };
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Login failed");
        if (data.need_code) {
          loginToken = data.login_token || "";
          if (!loginToken) throw new Error("Login challenge missing");
          showCodeStep(data.two_factor_method, data.message, data.passkey_available);
          btn.disabled = false;
          return;
        }
        location.href = "/";
      } catch (ex) {
        err.textContent = ex.message || "Login failed";
        btn.disabled = false;
      }
    });
    loadBrand();
  </script>
</body>
</html>
