<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050807" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SM Auth" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/static/auth-app-iphone.webmanifest" />
  <link rel="apple-touch-icon" href="/static/auth-app-icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/auth-app-icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <title>SM Auth · iPhone</title>
  <style>
    :root {
      --bg: #050807;
      --text: #eef7f1;
      --muted: #7f9588;
      --accent: #3ddea0;
      --danger: #ff7a7a;
      --line: rgba(170, 210, 185, .14);
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Sora", system-ui, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(110% 48% at 50% -8%, rgba(61,222,160,.22), transparent 52%),
        radial-gradient(80% 40% at 80% 100%, rgba(20,70,50,.28), transparent 55%),
        linear-gradient(180deg, #0b1410 0%, var(--bg) 42%, #030504 100%);
    }
    header {
      padding: calc(14px + var(--sat)) calc(20px + var(--sar)) 10px calc(20px + var(--sal));
      text-align: center;
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 18px;
      border: 1px solid rgba(61,222,160,.42);
      background:
        radial-gradient(circle at 35% 30%, rgba(138,240,196,.55), transparent 45%),
        linear-gradient(160deg, rgba(61,222,160,.28), rgba(61,222,160,.06));
      box-shadow: 0 12px 32px rgba(0,0,0,.3);
      position: relative;
    }
    .mark::after {
      content: "";
      position: absolute;
      inset: 15px;
      border-radius: 50%;
      border: 2.5px solid rgba(61,222,160,.9);
      box-shadow: inset 0 0 0 6px rgba(5,8,7,.55);
    }
    .brand {
      margin: 0;
      color: var(--accent);
      font-size: clamp(1.85rem, 8.5vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -.05em;
      line-height: 1.02;
      text-transform: none;
    }
    h1 {
      margin: 8px 0 0;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: .01em;
      color: var(--muted);
    }
    body.is-unlocked .mark {
      width: 34px;
      height: 34px;
      margin-bottom: 8px;
      border-radius: 10px;
    }
    body.is-unlocked .mark::after {
      inset: 9px;
      border-width: 1.5px;
      box-shadow: inset 0 0 0 3.5px rgba(5,8,7,.55);
    }
    body.is-unlocked .brand {
      font-size: 1.2rem;
      letter-spacing: -.03em;
    }
    body.is-unlocked h1 { display: none; }
    body.is-unlocked header {
      padding-top: calc(8px + var(--sat));
      padding-bottom: 4px;
    }
    body.is-unlocked {
      overflow: hidden;
    }
    body.is-unlocked main {
      justify-content: stretch;
      overflow: hidden;
      min-height: 0;
    }
    body.tab-circle .code-pane > .code,
    body.tab-circle .code-pane > .bar {
      display: none !important;
    }
    /* VPN trust circle: no brand mark / logo */
    body.tab-circle header .mark,
    body.tab-circle header .brand {
      display: none !important;
    }
    body.tab-circle header h1 {
      display: none !important;
    }
    body.tab-circle header {
      padding-top: calc(8px + var(--sat, env(safe-area-inset-top, 0px)));
      padding-bottom: 4px;
      min-height: 0;
    }
    /* Allowed tab: no approve-IP / refresh controls */
    body.circle-allowed .circle-add {
      display: none !important;
    }
    .tabs {
      display: none;
      gap: 0;
      padding: 0;
    }
    body.is-unlocked .tabs { display: grid; }
    .circle-toggle {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      font-size: .86rem;
      letter-spacing: .02em;
      font-weight: 600;
    }
    .circle-toggle[aria-pressed="true"] {
      background: rgba(61,222,160,.22);
      border-color: rgba(61,222,160,.6);
      color: #d9ffe9;
    }
    .circle {
      position: absolute;
      inset: 0;
      width: auto;
      margin: 0;
      padding: 12px calc(14px + var(--sar)) 12px calc(14px + var(--sal));
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: left;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      animation: rise .28s ease both;
    }
    .circle[hidden] { display: none !important; }
    .circle h3 {
      margin: 0 0 4px;
      font-size: .9rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .circle .sub {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .74rem;
      line-height: 1.4;
    }
    .circle .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      flex: 0 0 auto;
    }
    .circle .meta div {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,.03);
    }
    .circle .meta label {
      display: block;
      color: var(--muted);
      font-size: .62rem;
      margin-bottom: 2px;
    }
    .circle .meta strong {
      font-size: 1rem;
      font-weight: 600;
    }
    .circle-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 10px;
    }
    .circle-tabs button {
      margin: 0;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-weight: 700;
      padding: 10px 12px;
    }
    .circle-tabs button[aria-selected="true"] {
      background: rgba(52,211,153,.16);
      border-color: rgba(52,211,153,.4);
      color: var(--text);
    }
    .circle-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .circle-row {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255,255,255,.03);
    }
    .circle-row .ip {
      font-family: "IBM Plex Mono", monospace;
      font-size: .9rem;
      word-break: break-all;
    }
    .circle-row .info {
      color: var(--muted);
      font-size: .7rem;
      margin-top: 4px;
    }
    .circle-row .row-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }
    .circle-row .row-actions button {
      min-height: 42px;
      font-size: .8rem;
    }
    .circle-empty {
      color: var(--muted);
      font-size: .78rem;
      padding: 18px 4px;
      text-align: center;
    }
    .circle-add {
      display: grid;
      gap: 8px;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .circle-add input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.35);
      color: var(--text);
      padding: 12px;
      font: inherit;
      font-size: .84rem;
    }
    .code-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      gap: 22px;
      padding: 0 0 24px;
      min-height: 0;
    }
    body.tab-circle .code-pane {
      justify-content: stretch;
      align-items: stretch;
      gap: 0;
      padding: 0;
    }
    body.tab-circle .actions #copyBtn { display: none !important; }
    main {
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }
    .code-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      gap: 22px;
      padding: 0 0 24px;
    }
    .code-pane[hidden],
    .empty[hidden],
    .lock[hidden],
    button[hidden] { display: none !important; }
    .acct {
      text-align: center;
      color: var(--muted);
      font-size: .72rem;
      padding: 0 calc(14px + var(--sar)) 14px calc(14px + var(--sal));
      word-break: break-all;
    }
    .code {
      width: 100%;
      text-align: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(3.4rem, 17.5vw, 5rem);
      font-weight: 600;
      letter-spacing: .18em;
      padding-left: .18em;
      line-height: 1;
      margin: 0;
    }
    .bar {
      position: relative;
      left: auto;
      right: auto;
      bottom: auto;
      width: min(220px, 56%);
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, var(--accent), #8af0c4);
      transition: transform .18s linear;
    }
    .empty, .lock {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.45;
      padding: 24px calc(22px + var(--sar)) 24px calc(22px + var(--sal));
      gap: 16px;
      animation: rise .45s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .lock .face {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      border: 1px solid rgba(61,222,160,.4);
      background:
        radial-gradient(circle at 40% 30%, rgba(138,240,196,.35), transparent 50%),
        rgba(61,222,160,.1);
      display: grid;
      place-items: center;
      font-size: 1.55rem;
      letter-spacing: .08em;
      color: var(--accent);
      box-shadow: 0 16px 40px rgba(0,0,0,.28);
    }
    .lock h2 {
      margin: 0;
      color: var(--text);
      font-size: 1.2rem;
    }
    .lock p { margin: 0; max-width: 18rem; }
    .pin-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(280px, 100%);
    }
    .pin-row[hidden] { display: none !important; }
    .pin-row input {
      width: 100%;
      text-align: center;
      letter-spacing: .35em;
      font-family: "IBM Plex Mono", monospace;
      font-size: 1.35rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.35);
      color: var(--text);
      padding: 14px 12px;
    }
    footer {
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      padding: 12px calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .install {
      display: none;
      border: 1px dashed rgba(61,222,160,.4);
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(61,222,160,.07);
      font-size: .8rem;
      line-height: 1.45;
    }
    .install.show { display: block; }
    .install strong { color: var(--accent); }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    body.tab-circle .actions {
      grid-template-columns: 1fr;
    }
    .actions:empty { display: none; }
    body.is-unlocked .install { display: none !important; }
    .manual {
      width: 100%;
      display: none;
      gap: 10px;
      flex-direction: column;
    }
    .manual.show { display: flex; }
    .manual input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      color: var(--text);
      padding: 12px 14px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: .9rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      box-sizing: border-box;
    }
    .manual label {
      font-size: .78rem;
      color: var(--muted);
    }
    body.tab-circle .actions #manualBtn,
    body.tab-circle .manual { display: none !important; }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      border-radius: 14px;
      min-height: 48px;
      padding: 12px 10px;
      font: inherit;
      font-size: .86rem;
      font-weight: 600;
    }
    button.primary {
      background: rgba(61,222,160,.18);
      border-color: rgba(61,222,160,.5);
      color: #d9ffe9;
    }
    button.danger {
      border-color: rgba(255,122,122,.4);
      color: #ffc0c0;
    }
    .hint {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: .72rem;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + var(--sab));
      transform: translateX(-50%) translateY(16px);
      background: #132019;
      border: 1px solid rgba(61,222,160,.4);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: .8rem;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 30;
      max-width: calc(100% - 28px);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true"></div>
    <p class="brand">ServerManager</p>
    <h1>Authenticator</h1>
  </header>

  <main>
    <section class="lock" id="lockView" hidden>
      <div class="face" aria-hidden="true">◉</div>
      <h2 id="lockTitle">Face ID required</h2>
      <p id="lockSub">Unlock with Face ID to see your ServerManager codes.</p>
      <button type="button" class="primary" id="faceUnlockBtn" style="width:min(280px,100%)">Unlock with Face ID</button>
      <button type="button" id="setupFaceBtn" style="width:min(280px,100%)" hidden>Set up Face ID</button>
      <button type="button" id="usePinBtn" style="width:min(280px,100%)" hidden>Use PIN instead</button>
      <div class="pin-row" id="pinRow" hidden>
        <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••" />
        <button type="button" class="primary" id="pinSubmitBtn">Unlock with PIN</button>
      </div>
    </section>
    <section class="code-pane" id="codePane" hidden>
      <div class="code" id="codeView">------</div>
      <div class="bar"><i id="tickBar"></i></div>
      <section class="circle" id="circlePane" hidden>
        <h3>VPN trust circle</h3>
        <p class="sub">View pending or allowed. Allowed IPs can be moved back to pending or removed.</p>
        <div class="meta">
          <div><label>Allowlisted</label><strong id="circleAllowedCount">0</strong></div>
          <div><label>Pending</label><strong id="circlePendingCount">0</strong></div>
        </div>
        <div class="circle-tabs" role="tablist" aria-label="Circle lists">
          <button type="button" id="circleTabPending" role="tab" aria-selected="true">Pending</button>
          <button type="button" id="circleTabAllowed" role="tab" aria-selected="false">Allowed</button>
        </div>
        <div class="circle-list" id="circleList"><div class="circle-empty">Unlock, then open Circle.</div></div>
        <div class="circle-add">
          <input id="circleIpInput" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="Approve WAN IP (e.g. 203.0.113.10)" />
          <button type="button" class="primary" id="circleApproveBtn">Approve into circle</button>
          <button type="button" id="circleRefreshBtn">Refresh list</button>
        </div>
      </section>
    </section>
    <div class="empty" id="emptyView" hidden></div>
  </main>

  <footer>
    <div class="tabs" id="tabBar" hidden>
      <button type="button" class="circle-toggle" id="circleToggle" aria-pressed="false">VPN trust circle</button>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="copyBtn" hidden>Copy code</button>
      <button type="button" id="lockNowBtn" hidden>Lock</button>
      <button type="button" id="manualBtn" hidden>Enter secret</button>
    </div>
    <div class="manual" id="manualForm">
      <label for="secretInput">Base32 secret from portal</label>
      <input id="secretInput" autocomplete="off" spellcheck="false" placeholder="JBSWY3DPEHPK3PXP…" />
      <label for="accountInput">Account label (optional)</label>
      <input id="accountInput" autocomplete="off" spellcheck="false" placeholder="portal@…" />
      <button type="button" class="primary" id="saveManualBtn">Save on this iPhone</button>
    </div>
  </footer>
  <div class="toast" id="toast"></div>

  <script src="/static/sm-circle-crypto.js"></script>
  <script>
    const STORE_KEY = "sm.auth.totp.v1";
    const FACE_KEY = "sm.auth.face.cred.v1";
    const PIN_KEY = "sm.auth.pin.hash.v1";
    const PERIOD = 30;
    const DIGITS = 6;
    const LOCK_AFTER_MS = 45_000;

    const els = {
      lockView: document.getElementById("lockView"),
      lockTitle: document.getElementById("lockTitle"),
      lockSub: document.getElementById("lockSub"),
      codePane: document.getElementById("codePane"),
      emptyView: document.getElementById("emptyView"),
      codeView: document.getElementById("codeView"),
      tickBar: document.getElementById("tickBar"),
      copyBtn: document.getElementById("copyBtn"),
      lockNowBtn: document.getElementById("lockNowBtn"),
      manualBtn: document.getElementById("manualBtn"),
      manualForm: document.getElementById("manualForm"),
      secretInput: document.getElementById("secretInput"),
      accountInput: document.getElementById("accountInput"),
      saveManualBtn: document.getElementById("saveManualBtn"),
      faceUnlockBtn: document.getElementById("faceUnlockBtn"),
      setupFaceBtn: document.getElementById("setupFaceBtn"),
      usePinBtn: document.getElementById("usePinBtn"),
      pinRow: document.getElementById("pinRow"),
      pinInput: document.getElementById("pinInput"),
      pinSubmitBtn: document.getElementById("pinSubmitBtn"),
      toast: document.getElementById("toast"),
      circlePane: document.getElementById("circlePane"),
      circleList: document.getElementById("circleList"),
      circleAllowedCount: document.getElementById("circleAllowedCount"),
      circlePendingCount: document.getElementById("circlePendingCount"),
      circleIpInput: document.getElementById("circleIpInput"),
      circleApproveBtn: document.getElementById("circleApproveBtn"),
      circleAuthorizeBtn: document.getElementById("circleAuthorizeBtn"),
      circleRefreshBtn: document.getElementById("circleRefreshBtn"),
      circleTabPending: document.getElementById("circleTabPending"),
      circleTabAllowed: document.getElementById("circleTabAllowed"),
      tabBar: document.getElementById("tabBar"),
      circleToggle: document.getElementById("circleToggle"),
    };

    let account = null;
    let unlocked = false;
    let toastTimer = null;
    let idleTimer = null;
    let busy = false;
    let pinMode = false;
    let circleData = null;
    let circleLoading = false;
    let circleOpen = false;
    let circleView = "pending";
    let enrollUnlocked = false;
    let enrollStatusLoaded = false;

    function setCircleOpen(open) {
      circleOpen = !!open;
      document.body.classList.toggle("tab-circle", !!(account && unlocked && circleOpen));
      if (!circleOpen) document.body.classList.remove("circle-allowed");
      if (els.circleToggle) {
        els.circleToggle.setAttribute("aria-pressed", circleOpen ? "true" : "false");
        els.circleToggle.textContent = circleOpen ? "Back to codes" : "VPN trust circle";
      }
      if (account && unlocked) {
        els.copyBtn.hidden = circleOpen;
        if (circleOpen) {
          renderCircle();
          if (!circleData && !circleLoading) fetchCircle();
        } else if (els.circlePane) {
          els.circlePane.hidden = true;
        }
      }
    }

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function b64urlFromBuf(buf) {
      const bytes = new Uint8Array(buf);
      let s = "";
      for (const b of bytes) s += String.fromCharCode(b);
      return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    function bufFromB64url(s) {
      const pad = "=".repeat((4 - (s.length % 4)) % 4);
      const b64 = (s + pad).replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function randomBytes(n) {
      const out = new Uint8Array(n);
      crypto.getRandomValues(out);
      return out;
    }
    function loadFaceCredId() {
      return localStorage.getItem(FACE_KEY) || "";
    }
    function saveFaceCredId(id) {
      localStorage.setItem(FACE_KEY, id);
    }
    async function faceAvailable() {
      try {
        if (!window.PublicKeyCredential) return false;
        if (typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === "function") {
          return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        }
        return true;
      } catch (_) {
        return false;
      }
    }

        const finish = (ip) => {
          if (done) return;
          done = true;
          try { pc.close(); } catch (_) {}
          resolve(ip || "");
        };
        let pc;
        try {
          pc = new RTCPeerConnection({ iceServers: [] });
        } catch (_) {
          resolve("");
          return;
        }
        try { pc.createDataChannel("sm"); } catch (_) {}
        pc.onicecandidate = (ev) => {
          const cand = ev?.candidate?.candidate || "";
          const m = cand.match(
            /(?:^| )(\d{1,3}(?:\.\d{1,3}){3})(?: |\n|$)/
          );
          if (!m) return;
          const ip = m[1];
          if (/^192\.168\.8\.(?:[2-9]|\d{2}|1\d{2}|2[0-4]\d|25[0-4])$/.test(ip)) {
            finish(ip);
          }

      saveAccount({
        secret,
        issuer: "ServerManager",
        account: (els.accountInput?.value || "portal").trim() || "portal",
      });
      if (els.secretInput) els.secretInput.value = "";
      els.manualForm?.classList.remove("show");
      toast(loadFaceCredId() ? "Saved on this iPhone" : "Saved — set up Face ID");
      history.replaceState(null, "", location.pathname);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && unlocked) lockNow();
    });
    window.addEventListener("pagehide", () => {
      if (unlocked) lockNow();
    });
    window.addEventListener("blur", () => {
      if (unlocked) lockNow();
    });
    ["pointerdown", "keydown", "touchstart"].forEach((ev) => {
      document.addEventListener(ev, bumpIdle, { passive: true });
    });

    (async () => {
      await fetchEnrollStatus();
      const fromHash = parseHash();
      if (fromHash) {
        if (!enrollUnlocked) {
          history.replaceState(null, "", location.pathname);
          account = loadAccount();
          unlocked = false;
          render();
          toast("Enrollment is locked — unlock new devices in Security first");
        } else {
          saveAccount(fromHash);
          history.replaceState(null, "", location.pathname);
          toast(loadFaceCredId() ? "Account saved" : "Account saved — set up Face ID");
        }
      } else {
        account = loadAccount();
        unlocked = false;
        render();
      }
      setInterval(() => {
        fetchEnrollStatus();
      }, 15000);
    })();
    setInterval(tick, 250);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/auth-app-iphone-sw.js").catch(() => {});
    }
  </script>
</body>
</html>
