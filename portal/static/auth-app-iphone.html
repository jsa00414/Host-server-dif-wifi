<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050807" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SM Auth" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/static/auth-app-iphone.webmanifest" />
  <link rel="apple-touch-icon" href="/static/auth-app-icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/auth-app-icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <title>SM Auth · iPhone</title>
  <style>
    :root {
      --bg: #050807;
      --text: #eef7f1;
      --muted: #7f9588;
      --accent: #3ddea0;
      --danger: #ff7a7a;
      --line: rgba(170, 210, 185, .14);
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Sora", system-ui, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(120% 55% at 50% -5%, rgba(61,222,160,.2), transparent 55%),
        linear-gradient(180deg, #0a1210 0%, var(--bg) 46%, #030504 100%);
    }
    header {
      padding: calc(8px + var(--sat)) calc(16px + var(--sar)) 8px calc(16px + var(--sal));
      text-align: center;
    }
    .brand {
      margin: 0;
      color: var(--accent);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 4px 0 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -.03em;
    }
    main {
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }
    .code-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      position: relative;
      padding-bottom: 10px;
    }
    .code-pane[hidden],
    .empty[hidden],
    .lock[hidden],
    button[hidden] { display: none !important; }
    .acct {
      text-align: center;
      color: var(--muted);
      font-size: .72rem;
      padding: 0 calc(14px + var(--sar)) 14px calc(14px + var(--sal));
      word-break: break-all;
    }
    .code {
      width: 100%;
      text-align: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(3.4rem, 17.5vw, 5rem);
      font-weight: 600;
      letter-spacing: .18em;
      padding-left: .18em;
      line-height: 1;
      margin: 0;
    }
    .bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 7px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, var(--accent), #8af0c4);
      transition: transform .18s linear;
    }
    .empty, .lock {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.45;
      padding: 24px calc(22px + var(--sar)) 24px calc(22px + var(--sal));
      gap: 16px;
    }
    .lock .face {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      border: 1px solid rgba(61,222,160,.4);
      background: rgba(61,222,160,.1);
      display: grid;
      place-items: center;
      font-size: 2rem;
      color: var(--accent);
    }
    .lock h2 {
      margin: 0;
      color: var(--text);
      font-size: 1.2rem;
    }
    .lock p { margin: 0; max-width: 18rem; }
    .pin-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(280px, 100%);
    }
    .pin-row input {
      width: 100%;
      text-align: center;
      letter-spacing: .35em;
      font-family: "IBM Plex Mono", monospace;
      font-size: 1.35rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.35);
      color: var(--text);
      padding: 14px 12px;
    }
    footer {
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      padding: 12px calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .install {
      display: none;
      border: 1px dashed rgba(61,222,160,.4);
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(61,222,160,.07);
      font-size: .8rem;
      line-height: 1.45;
    }
    .install.show { display: block; }
    .install strong { color: var(--accent); }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .actions:empty { display: none; }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      border-radius: 14px;
      min-height: 48px;
      padding: 12px 10px;
      font: inherit;
      font-size: .86rem;
      font-weight: 600;
    }
    button.primary {
      background: rgba(61,222,160,.18);
      border-color: rgba(61,222,160,.5);
      color: #d9ffe9;
    }
    button.danger {
      border-color: rgba(255,122,122,.4);
      color: #ffc0c0;
    }
    .hint {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: .72rem;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + var(--sab));
      transform: translateX(-50%) translateY(16px);
      background: #132019;
      border: 1px solid rgba(61,222,160,.4);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: .8rem;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 30;
      max-width: calc(100% - 28px);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <p class="brand">ServerManager</p>
    <h1>iPhone Authenticator</h1>
  </header>

  <main>
    <section class="lock" id="lockView" hidden>
      <div class="face" aria-hidden="true">••</div>
      <h2 id="lockTitle">Enter PIN</h2>
      <p id="lockSub">Unlock with your app PIN to see ServerManager codes.</p>
      <div class="pin-row">
        <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••" />
        <button type="button" class="primary" id="pinSubmitBtn">Unlock</button>
        <button type="button" id="pinSetupBtn" hidden>Set PIN</button>
      </div>
    </section>
    <section class="code-pane" id="codePane" hidden>
      <div class="code" id="codeView">------</div>
      <div class="bar"><i id="tickBar"></i></div>
    </section>
    <div class="empty" id="emptyView">Open the setup link from the portal Security tab on this iPhone to save your account.</div>
  </main>

  <footer>
    <div class="install" id="installHint"></div>
    <div class="actions">
      <button type="button" class="primary" id="copyBtn" hidden>Copy code</button>
      <button type="button" id="lockNowBtn" hidden>Lock</button>
    </div>
  </footer>
  <div class="toast" id="toast"></div>

  <script>
    const STORE_KEY = "sm.auth.totp.v1";
    const PIN_KEY = "sm.auth.pin.hash.v1";
    const PERIOD = 30;
    const DIGITS = 6;
    const LOCK_AFTER_MS = 45_000;

    const els = {
      lockView: document.getElementById("lockView"),
      lockTitle: document.getElementById("lockTitle"),
      lockSub: document.getElementById("lockSub"),
      codePane: document.getElementById("codePane"),
      emptyView: document.getElementById("emptyView"),
      codeView: document.getElementById("codeView"),
      tickBar: document.getElementById("tickBar"),
      copyBtn: document.getElementById("copyBtn"),
      lockNowBtn: document.getElementById("lockNowBtn"),
      pinInput: document.getElementById("pinInput"),
      pinSubmitBtn: document.getElementById("pinSubmitBtn"),
      pinSetupBtn: document.getElementById("pinSetupBtn"),
      installHint: document.getElementById("installHint"),
      toast: document.getElementById("toast"),
    };

    let account = null;
    let unlocked = false;
    let toastTimer = null;
    let idleTimer = null;
    let busy = false;
    let setupMode = false;

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    // Drop old passkey Face ID credential if present.
    try { localStorage.removeItem("sm.auth.face.cred.v1"); } catch (_) {}

    async function hashPin(pin) {
      const data = new TextEncoder().encode(`sm-auth-iphone:${pin}`);
      const dig = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(dig)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    function loadPinHash() {
      return localStorage.getItem(PIN_KEY) || "";
    }
    function savePinHash(hash) {
      localStorage.setItem(PIN_KEY, hash);
    }
    function clearPinHash() {
      localStorage.removeItem(PIN_KEY);
    }

    function loadAccount() {
      try {
        const data = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (!data?.secret) return null;
        return {
          secret: String(data.secret).replace(/\s+/g, "").toUpperCase(),
          issuer: String(data.issuer || "ServerManager"),
          account: String(data.account || "portal"),
        };
      } catch (_) {
        return null;
      }
    }
    function saveAccount(next) {
      localStorage.setItem(STORE_KEY, JSON.stringify(next));
      account = next;
      unlocked = false;
      setupMode = !loadPinHash();
      render();
    }
    function parseHash() {
      const hash = (location.hash || "").replace(/^#/, "");
      if (!hash) return null;
      const params = new URLSearchParams(hash);
      const secret = (params.get("secret") || "").replace(/\s+/g, "").toUpperCase();
      if (!secret) return null;
      return {
        secret,
        issuer: params.get("issuer") || "ServerManager",
        account: params.get("account") || "portal",
      };
    }
    function b32Decode(secret) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      let bits = "";
      for (const ch of String(secret || "").replace(/=+$/, "").toUpperCase()) {
        const val = alphabet.indexOf(ch);
        if (val < 0) continue;
        bits += val.toString(2).padStart(5, "0");
      }
      const bytes = [];
      for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
      return new Uint8Array(bytes);
    }
    async function hmacSha1(keyBytes, msgBytes) {
      const key = await crypto.subtle.importKey("raw", keyBytes, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
      return new Uint8Array(await crypto.subtle.sign("HMAC", key, msgBytes));
    }
    async function totpAt(secret, forTime = Date.now() / 1000) {
      const counter = Math.floor(forTime / PERIOD);
      const msg = new Uint8Array(8);
      let n = counter;
      for (let i = 7; i >= 0; i--) { msg[i] = n & 0xff; n = Math.floor(n / 256); }
      const digest = await hmacSha1(b32Decode(secret), msg);
      const offset = digest[digest.length - 1] & 0x0f;
      const codeInt =
        ((digest[offset] & 0x7f) << 24) |
        ((digest[offset + 1] & 0xff) << 16) |
        ((digest[offset + 2] & 0xff) << 8) |
        (digest[offset + 3] & 0xff);
      return String(codeInt % 10 ** DIGITS).padStart(DIGITS, "0");
    }
    function remaining() {
      return PERIOD - ((Date.now() / 1000) % PERIOD);
    }
    async function tick() {
      if (!account || !unlocked) {
        els.codeView.textContent = "------";
        return;
      }
      try {
        els.codeView.textContent = await totpAt(account.secret);
        els.tickBar.style.transform = `scaleX(${remaining() / PERIOD})`;
      } catch (_) {
        els.codeView.textContent = "------";
      }
    }
    function isStandalone() {
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }
    function updateInstallUi() {
      if (isStandalone()) {
        els.installHint.classList.remove("show");
        return;
      }
      els.installHint.classList.add("show");
      els.installHint.innerHTML =
        "<strong>Install on iPhone:</strong> tap Share → <strong>Add to Home Screen</strong>, then open <strong>SM Auth</strong>.";
    }
    function bumpIdle() {
      clearTimeout(idleTimer);
      if (!unlocked || !account) return;
      idleTimer = setTimeout(() => lockNow("Locked after inactivity"), LOCK_AFTER_MS);
    }
    function lockNow(msg) {
      unlocked = false;
      setupMode = false;
      els.codeView.textContent = "------";
      els.pinInput.value = "";
      clearTimeout(idleTimer);
      render();
      if (msg) toast(msg);
    }
    function render() {
      const hasPin = !!loadPinHash();
      if (!account) {
        els.lockView.hidden = true;
        els.codePane.hidden = true;
        els.emptyView.hidden = false;
        els.copyBtn.hidden = true;
        els.lockNowBtn.hidden = true;
        els.codeView.textContent = "------";
        updateInstallUi();
        return;
      }
      els.emptyView.hidden = true;
      if (!unlocked) {
        els.lockView.hidden = false;
        els.codePane.hidden = true;
        els.copyBtn.hidden = true;
        els.lockNowBtn.hidden = true;
        const needSetup = setupMode || !hasPin;
        els.lockTitle.textContent = needSetup ? "Create PIN" : "Enter PIN";
        els.lockSub.textContent = needSetup
          ? "Choose a 4–8 digit PIN. Stored only on this iPhone — no passkey."
          : "Unlock with your app PIN to see ServerManager codes.";
        els.pinSubmitBtn.textContent = needSetup ? "Save PIN" : "Unlock";
        els.pinSetupBtn.hidden = needSetup || !hasPin;
        els.pinSetupBtn.textContent = "Change PIN";
        setTimeout(() => els.pinInput.focus(), 40);
      } else {
        els.lockView.hidden = true;
        els.codePane.hidden = false;
        els.copyBtn.hidden = false;
        els.lockNowBtn.hidden = false;
        tick();
        bumpIdle();
      }
      updateInstallUi();
    }

    async function withBusy(fn) {
      if (busy) return;
      busy = true;
      try { await fn(); }
      finally { busy = false; }
    }

    async function submitPin() {
      const pin = String(els.pinInput.value || "").replace(/\D+/g, "");
      if (pin.length < 4 || pin.length > 8) {
        toast("PIN must be 4–8 digits");
        return;
      }
      const hasPin = !!loadPinHash();
      const needSetup = setupMode || !hasPin;
      const hashed = await hashPin(pin);
      if (needSetup) {
        savePinHash(hashed);
        setupMode = false;
        unlocked = true;
        els.pinInput.value = "";
        render();
        toast("PIN saved");
        return;
      }
      if (hashed !== loadPinHash()) {
        els.pinInput.value = "";
        toast("Incorrect PIN");
        els.pinInput.focus();
        return;
      }
      unlocked = true;
      els.pinInput.value = "";
      render();
      toast("Unlocked");
    }

    els.pinSubmitBtn.addEventListener("click", () => withBusy(submitPin));
    els.pinSetupBtn.addEventListener("click", () => {
      setupMode = true;
      unlocked = false;
      els.pinInput.value = "";
      render();
    });
    els.pinInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") {
        ev.preventDefault();
        withBusy(submitPin);
      }
    });
    els.lockNowBtn.addEventListener("click", () => lockNow("Locked"));
    els.copyBtn.addEventListener("click", async () => {
      if (!unlocked) return;
      const code = els.codeView.textContent || "";
      if (!/^\d{6}$/.test(code)) return;
      try { await navigator.clipboard.writeText(code); toast("Copied"); }
      catch (_) { toast(code); }
      bumpIdle();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && unlocked) lockNow();
    });
    window.addEventListener("pagehide", () => {
      if (unlocked) lockNow();
    });
    window.addEventListener("blur", () => {
      if (unlocked) lockNow();
    });
    ["pointerdown", "keydown", "touchstart"].forEach((ev) => {
      document.addEventListener(ev, bumpIdle, { passive: true });
    });

    const fromHash = parseHash();
    if (fromHash) {
      saveAccount(fromHash);
      history.replaceState(null, "", location.pathname);
      toast(loadPinHash() ? "Account saved" : "Account saved — create a PIN");
    } else {
      account = loadAccount();
      unlocked = false;
      setupMode = !!(account && !loadPinHash());
      render();
    }
    setInterval(tick, 250);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/auth-app-iphone-sw.js").catch(() => {});
    }
  </script>
</body>
</html>
