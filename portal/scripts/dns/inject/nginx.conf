worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  server_tokens off;

  # Docker embedded DNS — re-resolve so inject survives recreate/reboot order.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    location / {
      set $adguard_upstream sm-adguard:3000;
      proxy_pass http://$adguard_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";
      proxy_set_header Accept-Language "en";
      sub_filter_types text/html;
      sub_filter '<head>' '<head><style id="sm-hide-scroll">html,body{scrollbar-width:none!important;-ms-overflow-style:none!important;overflow:auto!important;}*{scrollbar-width:none!important;-ms-overflow-style:none!important;}*::-webkit-scrollbar{width:0!important;height:0!important;background:transparent!important;}*::-webkit-scrollbar-thumb{background:transparent!important;}</style><style id="sm-adguard-portal">html,body,#root{background:#0b0f14!important;color:#e8eef5!important;}.wrapper{background:#0b0f14!important;min-height:100vh!important;}[data-theme="light"] .wrapper,[data-theme="DARK"] .wrapper,[data-theme="dark"] .wrapper{background:#0b0f14!important;}.footer,.footer__copyright,.footer__links,.footer__language,.footer__theme{display:none!important;visibility:hidden!important;height:0!important;overflow:hidden!important;}.card{background:rgba(255,255,255,.03)!important;border-color:rgba(255,255,255,.08)!important;}</style><script>(function(){try{var u=new URL(location.href);if(u.searchParams.get("lng")!=="en"){u.searchParams.set("lng","en");location.replace(u.toString());return;}localStorage.setItem("i18nextLng","en");document.documentElement.lang="en";document.documentElement.dataset.theme="dark";try{localStorage.setItem("account_theme",JSON.stringify("dark"));}catch(e){localStorage.setItem("account_theme","dark");}document.cookie="i18next=en;path=/;max-age=31536000;SameSite=Lax";function smHideFooter(){document.querySelectorAll(".footer").forEach(function(el){el.style.setProperty("display","none","important");el.remove();});}document.addEventListener("DOMContentLoaded",function(){document.body.dataset.theme="dark";smHideFooter();});new MutationObserver(smHideFooter).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}})();</script>';
      sub_filter_once on;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
    }
  }

  server {
    listen 8081;
    location = /sm-autologin {
      set $pihole_sso_upstream sm-pihole-sso:5081;
      proxy_pass http://$pihole_sso_upstream/sm-autologin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass_header Set-Cookie;
    }
    location / {
      set $pihole_upstream sm-pihole:80;
      proxy_pass http://$pihole_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";
      sub_filter_types text/html application/javascript;
      sub_filter '<head>' '<head><style id="sm-hide-scroll">html,body{scrollbar-width:none!important;-ms-overflow-style:none!important;overflow:auto!important;}*{scrollbar-width:none!important;-ms-overflow-style:none!important;}*::-webkit-scrollbar{width:0!important;height:0!important;background:transparent!important;}*::-webkit-scrollbar-thumb{background:transparent!important;}</style><style id="sm-pihole-portal">html,body,.wrapper,.content-wrapper{background:#0b0f14!important;color:#e8eef5!important;}.main-header,.main-sidebar,.main-footer{background:#0b0f14!important;border-color:rgba(255,255,255,.08)!important;}.content-wrapper{background:#0b0f14!important;}.box,.card,.box-solid,.nav-tabs-custom,.info-box{background:rgba(255,255,255,.03)!important;border-color:rgba(255,255,255,.08)!important;}.table>tbody>tr>td,.table>thead>tr>th{border-color:rgba(255,255,255,.08)!important;}.login-page,.login-box,.login-card-body{background:#0b0f14!important;}.login-donate{display:none!important;}.main-footer>.row:not(.version-info){display:none!important;}a[href*="pi-hole.net/donate"]{display:none!important;}.main-footer{opacity:.9;}</style>';
      sub_filter 'Donate</a></strong> if you found this useful.' '</a></strong>';
      sub_filter_once off;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
    }
  }
}
