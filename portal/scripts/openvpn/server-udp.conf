# OpenVPN UDP site tunnel (Flint) — faster than TCP/443 for bulk traffic.
port 1194
proto udp
dev tun1
topology subnet
server 10.9.1.0 255.255.255.0
keepalive 10 60
persist-key
persist-tun
explicit-exit-notify 1
data-ciphers AES-128-GCM:CHACHA20-POLY1305:AES-256-GCM:AES-256-CBC
data-ciphers-fallback AES-256-CBC
cipher AES-256-CBC
auth SHA256
tls-version-min 1.2
remote-cert-tls client
max-clients 8
status /var/log/openvpn-udp-status.log
log-append /var/log/openvpn-udp.log
verb 3
mute 20
tun-mtu 1500
# UDP: leave MSS alone; large buffers still help bursts.
sndbuf 8388608
rcvbuf 8388608
push "sndbuf 8388608"
push "rcvbuf 8388608"
txqueuelen 10000

ca /opt/openvpn/easy-rsa/pki/ca.crt
cert /opt/openvpn/easy-rsa/pki/issued/server.crt
key /opt/openvpn/easy-rsa/pki/private/server.key
dh /opt/openvpn/easy-rsa/pki/dh.pem
tls-auth /opt/openvpn/easy-rsa/pki/ta.key 0

client-config-dir /opt/openvpn/ccd-udp
push "route 10.9.1.0 255.255.255.0"
push "route 10.9.0.0 255.255.255.0"
push "route 192.168.8.0 255.255.255.0"
push "route 10.8.0.0 255.255.255.0"
push "route 10.42.42.0 255.255.255.0"
push "route 10.11.0.1 255.255.255.255"
push "dhcp-option DNS 10.42.42.44"

script-security 2
client-connect /opt/openvpn/scripts/client-connect-udp.sh
client-disconnect /opt/openvpn/scripts/client-disconnect.sh
