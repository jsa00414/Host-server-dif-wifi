port 8443
proto tcp-server
dev tun
topology subnet
server 10.9.0.0 255.255.255.0
keepalive 10 60
persist-key
persist-tun
explicit-exit-notify 0
cipher AES-256-CBC
auth SHA256
tls-version-min 1.2
remote-cert-tls client
duplicate-cn
max-clients 16
status /var/log/openvpn-status.log
log-append /var/log/openvpn.log
verb 3
mute 20

ca /opt/openvpn/easy-rsa/pki/ca.crt
cert /opt/openvpn/easy-rsa/pki/issued/server.crt
key /opt/openvpn/easy-rsa/pki/private/server.key
dh /opt/openvpn/easy-rsa/pki/dh.pem
tls-auth /opt/openvpn/easy-rsa/pki/ta.key 0

client-config-dir /opt/openvpn/ccd
push "route 10.9.0.0 255.255.255.0"
push "route 192.168.8.0 255.255.255.0"
push "route 10.8.0.0 255.255.255.0"
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 8.8.8.8"

script-security 2
client-connect /opt/openvpn/scripts/client-connect.sh
client-disconnect /opt/openvpn/scripts/client-disconnect.sh
# Keep nobody after scripts? scripts run as root before drop — OK with Type=notify early
