port 8443
proto tcp-server
dev tun
topology subnet
server 10.9.0.0 255.255.255.0
keepalive 10 60
persist-key
persist-tun
explicit-exit-notify 0
# Prefer faster AEAD ciphers first (VPS has AES-NI; AES-128-GCM is enough).
# Keep AES-256-GCM / CBC for older OpenVPN Connect clients.
data-ciphers AES-128-GCM:CHACHA20-POLY1305:AES-256-GCM:AES-256-CBC
data-ciphers-fallback AES-256-CBC
cipher AES-256-CBC
auth SHA256
tls-version-min 1.2
remote-cert-tls client
# Unique CNs + CCD (flint=10.9.0.2, windows=10.9.0.10). duplicate-cn fights CCD.
max-clients 16
status /var/log/openvpn-status.log
log-append /var/log/openvpn.log
verb 3
mute 20
tcp-nodelay
tun-mtu 1500
# Slightly tighter MSS helps TCP-over-TCP through sslh/:443.
mssfix 1280
# Large socket buffers — default ~208KiB was capping the tunnel near ~5Mbps.
sndbuf 8388608
rcvbuf 8388608
push "sndbuf 8388608"
push "rcvbuf 8388608"
txqueuelen 10000

ca /opt/openvpn/easy-rsa/pki/ca.crt
cert /opt/openvpn/easy-rsa/pki/issued/server.crt
key /opt/openvpn/easy-rsa/pki/private/server.key
dh /opt/openvpn/easy-rsa/pki/dh.pem
tls-auth /opt/openvpn/easy-rsa/pki/ta.key 0

client-config-dir /opt/openvpn/ccd
push "route 10.9.0.0 255.255.255.0"
push "route 192.168.8.0 255.255.255.0"
push "route 10.8.0.0 255.255.255.0"
push "route 10.42.42.0 255.255.255.0"
push "route 10.11.0.1 255.255.255.255"
push "dhcp-option DNS 10.42.42.44"

script-security 2
client-connect /opt/openvpn/scripts/client-connect.sh
client-disconnect /opt/openvpn/scripts/client-disconnect.sh
