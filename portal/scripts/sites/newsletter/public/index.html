<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newsletter</title>
  <meta name="description" content="Notes, updates, and dispatches." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="hero">
    <p class="brand">Newsletter</p>
    <h1>Dispatches worth keeping.</h1>
    <p class="lede">A quiet place for updates, notes, and the occasional long read. More issues soon.</p>
    <form class="cta" action="#" method="get" onsubmit="return false;">
      <label class="sr-only" for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
      <button type="submit">Notify me</button>
    </form>
    <p class="fine">Hosted on the ServerManager stack · newsletter.vpstruelord.com</p>
  </main>
  <script>
    document.querySelector(".cta")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      if (!btn) return;
      btn.textContent = "Coming soon";
      btn.disabled = true;
    });
  </script>
</body>
</html>
