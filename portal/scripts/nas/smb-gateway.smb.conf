[global]
   workgroup = WORKGROUP
   server string = ServerManager NAS Gateway
   security = user
   map to guest = never
   smb ports = 14450
   bind interfaces only = yes
   interfaces = 127.0.0.1
   server min protocol = SMB2
   client min protocol = SMB2
   ntlm auth = yes
   log file = /var/log/samba/nas-gateway.log
   max log size = 50
   load printers = no
   printing = bsd
   disable spoolss = yes

[share]
   path = /mnt/nas-gateway
   browseable = yes
   read only = no
   guest ok = no
   valid users = admin
   force user = root
   force group = root
   create mask = 0664
   directory mask = 0775
