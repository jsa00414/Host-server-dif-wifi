global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          instance: vps

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: vps
          host: vpstruelord-vps

  - job_name: circle-drift-textfile
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: vps
          collector: textfile

  - job_name: docker
    static_configs:
      - targets: ["docker-stats:9487"]
        labels:
          instance: vps
          host: vpstruelord-vps

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          instance: vps
